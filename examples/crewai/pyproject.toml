[project]
name = "agentce-example-crewai"
version = "0.0.1"
description = "Runnable crewai example (SPEC 13.4 AX-3/AX-4): really imports and runs crewai, offline and keyless against a scripted deterministic model, and emits the evidence through agentce-emit."
requires-python = ">=3.12"
dependencies = [
  "agentce-emit",
  "crewai",
]

[tool.uv]
package = false
# chromadb (crewai's transitive default-embeddings dependency) accepts onnxruntime>=1.14.1 with no
# upper bound and uv resolves the newest by default; 1.24+ dropped macOS x86_64 wheels, which would
# make this example uninstallable on Intel Macs. Cap it at the last release with those wheels -- a
# mature, advisory-clean version (OSV: no known vulnerabilities), not a test-environment special case.
constraint-dependencies = ["onnxruntime<1.24"]
# crewai pins chromadb~=1.1.0; every published chromadb release, including the newest (1.5.9), is
# still inside the vulnerable range of several advisories against its server component (see
# docs/adr/0018-crewai-chromadb-advisory-exception.md for the four GHSA IDs and why this example's
# use is not reachable). Override to the newest release anyway, so this at least tracks upstream
# instead of pinning to whatever crewai's own constraint happened to resolve first.
# json-repair is an unconstrained crewai dependency; below 0.60.1 it carries a high-severity
# unbounded-CPU-DoS advisory (GHSA-xf7x-x43h-rpqh). Pin the first patched release rather than
# letting uv float to whatever is newest today -- a mature, advisory-clean version, not the
# release from yesterday.
override-dependencies = ["chromadb>=1.5.9", "json-repair==0.60.1"]

[tool.uv.sources]
agentce-emit = { path = "../../engines/python-emit", editable = true }
agent-conformance = { path = "../../engines/python", editable = true }

[dependency-groups]
dev = [
  "agent-conformance",
  "pytest>=8,<9",
  "mypy>=1.11,<2",
  "ruff>=0.6,<0.13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"

[tool.mypy]
python_version = "3.12"
