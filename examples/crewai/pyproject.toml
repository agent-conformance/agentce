[project]
name = "agentce-example-crewai"
version = "0.0.1"
description = "Runnable crewai example (SPEC 13.4 AX-3/AX-4): really imports and runs crewai, offline and keyless against a scripted deterministic model, and emits the evidence through agentce-emit."
requires-python = ">=3.12"
dependencies = [
  "agentce-emit",
  "crewai",
]

[tool.uv]
package = false
# chromadb (crewai's transitive default-embeddings dependency) accepts onnxruntime>=1.14.1 with no
# upper bound and uv resolves the newest by default; 1.24+ dropped macOS x86_64 wheels, which would
# make this example uninstallable on Intel Macs. Cap it at the last release with those wheels -- a
# mature, advisory-clean version (OSV: no known vulnerabilities), not a test-environment special case.
constraint-dependencies = ["onnxruntime<1.24"]
# crewai pins chromadb~=1.1.0, which excludes the fix for CVE-2026-45829 (a pre-authentication code
# injection vulnerability in ChromaDB's server component, GHSA-f4j7-r4q5-qw2c, patched in 1.5.9). This
# example never runs the ChromaDB server (no network exposure here), but shipping a lockfile with a
# known-critical vulnerable package is not something this repository does regardless of reachability.
# Override crewai's own pin so uv resolves the patched release instead.
override-dependencies = ["chromadb>=1.5.9"]

[tool.uv.sources]
agentce-emit = { path = "../../engines/python-emit", editable = true }
agent-conformance = { path = "../../engines/python", editable = true }

[dependency-groups]
dev = [
  "agent-conformance",
  "pytest>=8,<9",
  "mypy>=1.11,<2",
  "ruff>=0.6,<0.13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"

[tool.mypy]
python_version = "3.12"
