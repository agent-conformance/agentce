# Public-claims register - every public claim the project makes, the pages that state it, whether it
# is `built` (proven by a wired CI check) or `roadmap`, and the check that proves it. See ADR-0010.
#
# A claim is `built` only together with a green CI check that runs on every pull request. Claims that
# are not yet true are entered as `roadmap` during the phase-8 truth-first sweep, and each flips to
# `built` only when its proving check goes green. `tools/claims_check.py` enforces these rules on
# every push and pull request.
#
# The register starts with the claims that are demonstrably true today. It grows to cover every
# remaining public claim as the truth-first work lands.
version: 1
claims:
  - id: engine.deterministic
    text: >-
      The reference engine is deterministic: the same inputs produce byte-identical canonical
      outputs, independent of order, locale, and clock. Per-project manifests are byte-identical on
      x86_64 and arm64, excluding only the recorded run timestamp, host fingerprint, and operator.
    status: built
    pages:
      - website/src/pages/index.astro
    check:
      workflow: .github/workflows/determinism.yml
      job: compare
      description: >-
        Runs the Engine Conformance Suite on two CPU architectures and fails unless the normalised
        per-project manifests are identical.
  - id: engine.model-free
    text: >-
      No evaluation path, nor its dependency tree, resolves a machine-learning framework, an LLM, or
      an embedding client. The engine evaluates explicit rules over structured evidence and never
      guesses.
    status: built
    pages:
      - website/src/pages/index.astro
    check:
      workflow: .github/workflows/no-ml.yml
      job: no-ml
      description: >-
        Scans every uv.lock in the repository against the no-learned-components denylist and fails
        on any match.
  - id: engine.assertions-byte-identical
    text: >-
      The Python, TypeScript, and Java engines produce byte-identical per-project assertions.json
      over the simulated corpus for `agentce conformance run`.
    status: built
    pages:
      - website/src/pages/index.astro
      - website/src/content/docs/docs/running-assessments.md
      - docs/quickstart-typescript.md
      - docs/quickstart-java.md
    check:
      workflow: .github/workflows/three-engine.yml
      job: compare
      description: >-
        Runs all three engines over the full corpus and fails unless their per-project
        assertions.json outputs are byte-identical.
  - id: engine.canonical-set-identical
    text: >-
      Beyond assertions.json, the three engines' evidence packs are byte-identical per project, and their
      oscal-ar.json and results.sarif are identical once the engine name and version each carries by
      design are set aside.
    status: built
    pages:
      - docs/quickstart-typescript.md
      - docs/quickstart-java.md
    check:
      workflow: .github/workflows/three-engine.yml
      job: compare
      description: >-
        Runs all three engines over the full corpus and fails unless each project's assertions.json and
        every packs/*/pack.json are byte-identical and its oscal-ar.json and results.sarif match after
        the engine name and version are neutralised; a self-test proves the comparator flags a missing
        artifact, a pack without its per-assertion evidence, and a byte change.
  - id: engine.numeric-edge-parity
    text: >-
      The three engines decide a JSON number token the same way (a fraction or exponent is refused even
      on a whole number, an integer above 2^53 - 1 is refused, and the canonical form of what is
      accepted is identical) and order integer and date-time literals the same way, exactly and without
      floating point, on the shared edge vectors.
    status: built
    pages:
      - spec/model/canonical-form.md
      - spec/rules/psp.md
    check:
      workflow: .github/workflows/three-engine.yml
      job: numeric-temporal-edge-vectors
      description: >-
        Scores the shared number-token and literal-ordering vectors in Python, TypeScript, and Java and
        fails unless every engine reproduces each expected result and the three agree; each engine's own
        canonical-vector suite reads the same vector files with a parser that keeps number tokens.
  - id: ci.tests-gate
    text: >-
      Every push and pull request runs the per-package quality gate for all three engines: lint,
      type-check, and tests with a declared coverage floor. Nothing merges without that signal.
    status: built
    pages:
      - AGENTS.md
    check:
      workflow: .github/workflows/tests.yml
      job: python
      description: >-
        The tests workflow runs ruff, mypy, and pytest (with a coverage floor) for the Python
        engine, biome/tsc/tests for the TypeScript engine, and gradlew check with a JaCoCo floor for
        the Java engine, on every push and pull request.
  - id: verifiable.signed-artifacts
    text: >-
      Implementation reports and catalogs are signed and content-addressed. `agentce verify
      --catalog` and `agentce verify --release` check a signature offline and report the signer and
      trust status; `agentce sign <report-dir> --as claimant|assessor` produces a signed claim for an
      implementation report under a chosen signing profile, refusing to sign a report that is not
      ready to publish.
    status: built
    pages:
      - website/src/pages/index.astro
      - website/src/content/docs/docs/running-assessments.md
    check:
      workflow: .github/workflows/tests.yml
      job: python
      description: >-
        engines/python/tests/test_verify_targets.py exercises `verify --catalog`/`--release`
        (signer identity, trust, tamper and wrong-key rejection); test_cli.py::test_sign_ok and
        test_signing.py exercise the `sign` CLI path and its DSSE/KMS/keyless signing profiles.
  - id: cli.inspect-verify
    text: >-
      `agentce config show --json` prints every option, its resolved value, and where that value
      came from; `agentce doctor` reports configuration problems with the exact fix for each.
    status: built
    pages:
      - website/src/content/docs/docs/running-assessments.md
    check:
      workflow: .github/workflows/tests.yml
      job: python
      description: >-
        engines/python/tests/test_doctor.py and test_cli.py exercise `agentce doctor` and
        `agentce config show` against real configuration states, including the failure cases doctor
        is meant to catch.
  - id: ci.offline-none
    text: >-
      An assessment runs with networking disabled. A dedicated job runs a real assessment inside a
      network namespace with no route off the host, and fails if the namespace can still reach the
      network.
    status: built
    pages:
      - AGENTS.md
    check:
      workflow: .github/workflows/ci.yml
      job: no-network
      description: >-
        Runs agentce quickstart inside an isolated network namespace (unshare -n) after asserting the
        namespace cannot open a socket off the host, proving the offline invariant by behaviour.
  - id: firstrun.platforms
    text: >-
      The reference engine installs from its frozen lockfile and runs the quickstart to a report on
      Linux (x86_64), Apple-silicon macOS, and Intel macOS. Linux and Apple-silicon macOS use a
      prebuilt cryptography wheel; Intel macOS has none and compiles cryptography from source, which
      needs Rust and OpenSSL 3. Getting Started states the prerequisites, and `agentce doctor`
      reports the Python version and whether cryptography came from a prebuilt wheel or a source
      build.
    status: built
    pages:
      - website/src/content/docs/docs/getting-started.md
    check:
      workflow: .github/workflows/ci.yml
      job: python-install-matrix
      description: >-
        On every pull request, installs the engine from the frozen lockfile on ubuntu-latest,
        macos-latest (arm64), and macos-15-intel, asserts `agentce doctor` reports the wheel
        provenance the docs state for that platform, and runs the quickstart to a report.
  - id: quickstart.offline-from-wheel
    text: >-
      A wheel built from the reference engine, installed on its own, runs `agentce quickstart` from an
      empty directory with no checkout of the repository and no network: the base and sector-overlay
      catalogs and the quickstart project ship inside the package, and the sdist carries them too.
    status: built
    pages:
      - website/src/content/docs/docs/running-assessments.md
    check:
      workflow: .github/workflows/tests.yml
      job: python
      description: >-
        Builds the sdist and the wheel on every pull request, puts only the wheel's contents on the
        import path, and runs quickstart, assess, and readiness from an empty directory; other tests
        hold each vendored tree byte-identical to its spec/ or corpus/ original in all three engines.
  - id: quickstart.verdict
    text: >-
      `agentce quickstart` and `agentce assess` open their output, the top of report.md and report.html,
      and a `summary` object in the `--json` envelope with a categorical verdict (conformant, incomplete, or
      non-conformant), the six-outcome tally, the top gaps, and the next step. The verdict is never a
      composite score.
    status: built
    pages:
      - website/src/content/docs/docs/getting-started.md
    check:
      workflow: .github/workflows/tests.yml
      job: python
      description: >-
        On every pull request, runs the real quickstart and assess commands and fails unless the printed
        verdict, tally, gaps, and next step, the leading section of report.md and report.html, and the
        --json summary all agree with a fresh assertions.json; the Java engine renders the same report
        sections byte-for-byte from shared golden cases covering every verdict state.
  - id: hero.tally
    text: >-
      The landing-page terminal shows the real output of `agentce quickstart` over the bundled
      corpus/quickstart project - the command's own stdout and the outcome summary of the report it
      wrote - and its caption states that run's tally of conformant, insufficient-evidence, and
      not-assessed verdicts. The page carries no hand-written all-pass claim.
    status: built
    pages:
      - website/src/pages/index.astro
    check:
      workflow: .github/workflows/website.yml
      job: build
      description: >-
        Runs a fresh quickstart on every pull request and fails unless the committed hero terminal
        and caption equal that run, and fails on the banned all-pass sentences; a self-test proves the
        check rejects a changed tally, a stale run, and a hand-written claim.
  - id: quickstart.tally
    text: >-
      The Getting Started page, the docs quickstart page, and the corpus quickstart README state the
      conformant, insufficient-evidence, and not-assessed tally of a real `agentce quickstart` run over
      the bundled corpus/quickstart project, define insufficient evidence in place, and carry no
      blanket "every control is conformant" claim. The bundled project is not all-conformant.
    status: built
    pages:
      - website/src/content/docs/docs/getting-started.md
      - docs/quickstart.md
      - corpus/quickstart/README.md
    check:
      workflow: .github/workflows/website.yml
      job: build
      description: >-
        Runs a fresh quickstart on every pull request and fails unless each of the three pages equals
        what that run generates and none claims every control is conformant while the run is not; a
        self-test proves the check rejects a changed tally, a stale run, missing markers, and a softened
        blanket claim, and passes an honest partial tally.
  - id: docs.commands_runnable
    text: >-
      Every shell command shown on the documentation site's pages runs against the real command-line
      tool and exits 0 when pasted from a checkout, and the terms bundle, profile, and layout are each
      defined once on the Concepts page. A command that stops working fails the build.
    status: built
    pages:
      - website/src/content/docs/docs/running-assessments.md
      - website/src/content/docs/docs/ci-integration.md
      - website/src/content/docs/docs/getting-started.md
      - website/src/content/docs/docs/concepts.md
    check:
      workflow: .github/workflows/website.yml
      job: docs-doctest
      description: >-
        Executes every fenced bash, sh, or console block on the docs site from a fresh scratch directory
        against the real CLI on every pull request and fails on any non-zero exit, on a block that was
        removed instead of fixed, and on an opt-out with no reason; a self-test proves the checker
        rejects each of those and the once-documented assess command that named a bundle that does not
        exist.
  - id: cli.docs-match-implementation
    text: >-
      The TypeScript and Java quickstart pages tell a reader to run only commands those engines
      implement; run for real, `conformance run` claims full and writes one non-empty assertions.json
      per project. A page that prescribes a command the engine rejects as unavailable fails the build.
    status: built
    pages:
      - docs/quickstart-typescript.md
      - docs/quickstart-java.md
      - website/src/content/docs/docs/running-assessments.md
    check:
      workflow: .github/workflows/three-engine.yml
      job: compare
      description: >-
        On every pull request, runs the real TypeScript and Java command-line tools: every command a
        quickstart page names is invoked and must not be rejected as unavailable, then `conformance
        run` is executed and must claim full with one non-empty assertions.json per reported project;
        the checker's own tests reject a page that names a command the engine rejects, an engine that
        writes fewer or empty assertions, and a partial claim.
  - id: engine.ts-java-assess
    text: >-
      The TypeScript and Java engines implement `assess`, `validate`, `report`, and `quickstart` on the
      same evaluation path `conformance run` exercises. Schema validation (`report --validate`) is not
      yet ported to them; the Python engine remains the reference for that one check.
    status: built
    pages:
      - docs/quickstart-typescript.md
      - docs/quickstart-java.md
      - website/src/content/docs/docs/running-assessments.md
      - engines/typescript/README.md
      - engines/java/README.md
    check:
      workflow: .github/workflows/quickstart.yml
      job: typescript
      description: >-
        On every pull request, builds the TypeScript engine and runs `assess` against the vendored
        quickstart project, asserting a non-empty assertions.json and a real verdict; the `java` job in
        the same workflow proves the same for the Java engine.
  - id: integration.framework-capture
    text: >-
      Capturing every model/tool/decision automatically from LangGraph, the OpenAI Agents SDK, CrewAI,
      Google ADK, and the Claude Agent SDK, from one line and no further code, is planned and not yet
      built; `agentce_emit.auto()` alone still captures no per-event framework activity by itself.
      Five of the six example agents now really import and run their named framework, but each does so
      with its own integration code -- a callback/event handler that turns that framework's real
      callback payloads into explicit `emit_*` calls -- not automatic capture from the one line alone.
    status: roadmap
    pages:
      - docs/integrate.md
      - engines/python-emit/README.md
      - website/src/content/docs/docs/ci-integration.md
      - examples/scenario.py
  - id: examples.frameworks-labelled
    text: >-
      Each of the six example agents either imports a real package of its own or says in its own source
      that automatic framework capture is on the roadmap, and the pages that explain the one-line setup
      say the same for as long as `agentce_emit.auto()` with zero `emit_*` calls records nothing beyond
      the fact that a session ran, never a framework's per-event activity. The examples still run and
      their bundles validate with zero quarantines.
    status: built
    pages:
      - docs/integrate.md
      - engines/python-emit/README.md
      - website/src/content/docs/docs/ci-integration.md
    check:
      workflow: .github/workflows/ci.yml
      job: examples
      description: >-
        On every pull request, runs the real `agentce_emit.auto()` with no `emit_*` call, measured
        before flush, and fails when an example or a setup page does not label automatic framework
        capture as roadmap, or when that measurement starts finding events without the wording and this
        claim being retired; a self-test rejects an unlabelled example, a standard-library import passed
        off as a framework, a page without the label, and a label that appears only on another page.
        Also runs every example and validates its bundle.
  - id: examples.frameworks-really-run
    text: >-
      Five of the six example agents (LangGraph, the OpenAI Agents SDK, CrewAI, Google ADK, the Claude
      Agent SDK) really import and run their named framework end to end, offline and keyless, against a
      scripted deterministic model or transport -- never a live network call, never a real API key --
      and each produces a bundle the engine accepts with zero quarantines. Each example resolves its
      framework's own dependencies in its own isolated environment, never the engine's.
    status: built
    pages:
      - docs/integrate.md
      - examples/scenario.py
    check:
      workflow: .github/workflows/ci.yml
      job: python-tests
      description: >-
        On every pull request, runs each of the five framework examples for real through its own run.sh
        and asserts the agent script imports its named framework (no roadmap-label fallback), the run
        exits 0, and the resulting bundle ingests with zero quarantines and the ModelCall/ToolCall/
        Decision/SessionStart/SessionEnd event types -- proving the framework's own code path ran, not
        merely that the script names the package.
  - id: collect.source-connector
    text: >-
      Pulling evidence from a source system with `agentce collect` is planned and not yet built:
      `--dry-run` plans a job offline, and a real run has no source connector, so it records every
      source incomplete and exits 1.
    status: roadmap
    pages:
      - docs/integrate.md
      - docs/reference/commands/collect.md
      - adapters/fixtures/collect-dry-run.yaml
  - id: collect.pages-labelled
    text: >-
      The command page, the integration guide, and the example collection config each say that a real
      `agentce collect` has no source connector and records every source incomplete, and the config
      says an OTLP export is pushed to files or object storage rather than polled, for as long as a real
      run of the shipped config completes no source.
    status: built
    pages:
      - docs/integrate.md
      - docs/reference/commands/collect.md
      - adapters/fixtures/collect-dry-run.yaml
    check:
      workflow: .github/workflows/ci.yml
      job: collect-honesty
      description: >-
        On every pull request, runs the real `agentce collect` against the shipped example config and
        fails when the generated command page, the integration guide beside any mention of the command,
        or the config does not say a real run has no source connector, or when the config does not say
        an OTLP export is pushed; if a real run ever completes, no caveat is owed. A self-test rejects a
        guide that promises collection, a caveat placed far from the mention, a silent command page, and
        a config that hides the missing connector or models push as pull.
  - id: container.minimal-from-wheel
    text: >-
      The engine container image is built in two stages from the reference engine's wheel and its
      hash-pinned dependencies, so it holds the installed package rather than the repository. Its
      build context excludes private and dev paths, and the image runs the quickstart with the
      network disabled. The image is built and run in CI but is not published to a registry yet.
    status: built
    pages:
      - docs/quickstart-python.md
    check:
      workflow: .github/workflows/quickstart.yml
      job: image
      description: >-
        On every pull request, builds the image from engines/python/Dockerfile, runs the quickstart
        in it with no network and checks the report it wrote, and asserts the engine is imported
        from site-packages and that no repository or private path exists in the image; the hygiene
        job also runs the recipe check over the Dockerfile and the .dockerignore.
  - id: install.release-state-parity
    text: >-
      The Install page shows a zero-install command (uvx, pipx, npx, or docker run) for a distribution
      channel only when the release-state switch marks that channel published, and the command that
      works from a checkout today otherwise; a published channel names a pinned version or image digest.
    status: built
    pages:
      - website/src/content/docs/docs/install.mdx
    check:
      workflow: .github/workflows/website.yml
      job: build
      description: >-
        On every pull request, runs the Install check's self-test (the resolver flips both ways per
        channel, constant resolvers are rejected, and planted leaks, unpinned or unfinished artifacts,
        hand-typed one-liners, and missing tabs each fail) and then checks the built site, where the tabs
        must equal what the switch renders and no built page may show the one-liner of an unpublished
        channel.
  - id: skill.ide-sarif-viewer
    text: >-
      Reading a generated skill's findings through an IDE's SARIF viewer is planned and not yet built:
      it depends on the SARIF code-scanning enrichment `results.sarif` does not yet carry; the
      generated skill folder (`assess --emit skill`) and the canonical `--json` CLI are the extension
      point today.
    status: roadmap
    pages:
      - skills/README.md
  - id: a11y.statement-vpat
    text: >-
      The website publishes an EU-model accessibility statement, a VPAT 2.5 mapped to EN 301 549
      clauses 9 (Web), 10 (Non-web documents), and 11 (Software), and a manual accessibility test
      protocol (screen reader, keyboard-only, 200%-400% zoom/reflow, forced-colors). Every VPAT
      criterion honestly reads "Not Evaluated" with the automated axe-core evidence recorded in
      Remarks, until a person runs the manual protocol and records a real conformance level.
    status: built
    pages:
      - website/src/content/docs/docs/accessibility-statement.md
      - website/src/content/docs/docs/vpat.md
      - website/src/content/docs/docs/accessibility-testing-protocol.md
    check:
      workflow: .github/workflows/website.yml
      job: a11y-statement
      description: >-
        On every pull request, builds the site and checks that the accessibility statement, VPAT, and
        manual test protocol pages are built, linked from the site's own navigation, and still carry
        every required structural element (self-tested first against a good/bad fixture set).
  - id: catalog.second-base-catalog
    text: >-
      A second standards-body base catalog, NIST AI RMF, is a real catalog that loads through the same
      `agentce catalog lint` / `agentce assess --catalog` path as the EU AI Act catalog, with its own
      signature and provenance digest, no engine code change. It currently substantiates the six control
      subcategories the existing EU-AI-Act-to-NIST-AI-RMF crosswalk already maps with runtime evidence;
      full AI RMF coverage is roadmap.
    status: built
    pages:
      - website/src/content/docs/docs/catalog-authoring.md
    check:
      workflow: .github/workflows/guards.yml
      job: catalog-lint
      description: >-
        Lints every base catalog (including nist-ai-rmf) with provenance required, and runs a
        dedicated substantiation checker confirming every crosswalk entry the catalog carries is
        unverified-by-design and maps to a control the companion crosswalk file actually substantiates.
  - id: catalog.bring-your-own
    text: >-
      A third party can author a control catalog for their own standard or internal rule set, lint it,
      sign it, and load it with `--catalog-dir`, without forking or changing any of the three engines.
      The authoring toolkit rejects a SHACL shape that uses a forbidden SPARQL- or script-based
      construct by a specific, stable message key rather than accepting it silently.
    status: built
    pages:
      - website/src/content/docs/docs/catalog-authoring.md
    check:
      workflow: .github/workflows/guards.yml
      job: catalog-lint
      description: >-
        Runs the catalog-authoring toolkit's self-test (a clean synthetic catalog lints; the same
        catalog with an sh:sparql shape is rejected by name) and the doc-test harness against the
        catalog-authoring page's commands.
  - id: runtime-conformance
    text: >-
      Re-running `agentce assess --state <dir>` over an accumulating evidence stream -- a chronological
      series of real, point-in-time assessments, never a persistent watch or daemon process -- detects
      per-(subject, control) outcome drift and captures the incident evidence that caused it,
      deterministically.
    status: built
    pages:
      - website/src/content/docs/docs/runtime-conformance.md
    check:
      workflow: .github/workflows/guards.yml
      job: runtime-conformance
      description: >-
        Runs a real three-step assess scenario (conformant, an identical no-op re-run, then a new
        incident that flips the outcome) through the installed CLI, twice from independent fresh state
        directories, and requires assertions.json and runtime_drift.jsonl to be byte-identical at every
        step; also proves the negative cases (idempotent re-run, a pre-upgrade state directory, and
        per-pair discrimination) and that the guard job itself runs both the self-test and the real
        scenario.
  - id: integrations.framework-breadth
    text: >-
      Ten example framework/SDK integrations -- LangGraph, the OpenAI Agents SDK, CrewAI, Google ADK,
      the Claude Agent SDK, AutoGen, LlamaIndex, Semantic Kernel, Bedrock Agents, and Vertex Agents --
      each really import and run their named SDK, offline and keyless, against a scripted
      deterministic model or transport. Three further `examples/` scripts (MCP server, A2A mesh, and a
      hand-rolled custom loop) round the directory out to thirteen runnable examples but emit evidence
      directly through `agentce_emit` rather than importing a distinct third-party SDK.
    status: built
    pages:
      - docs/integrate.md
    check:
      workflow: .github/workflows/ci.yml
      job: integration-breadth
      description: >-
        Runs tools/framework_examples_check.py: every example's agent.py really imports its named
        framework at the top level, running it end to end produces a bundle the engine ingests with
        zero quarantines and the required event types, the no-ml dependency boundary holds with real
        frameworks installed, and the five new examples' chokepoint symbol is documented and genuinely
        used, not merely named in prose.
  - id: integrations.trace-store-connectors
    text: >-
      A realistic export shaped exactly as Langfuse, Phoenix/Arize, Datadog LLM Observability, and
      LangSmith each actually produce it round-trips into canonical AgentCE events through the existing
      otel-genai adapter, zero quarantines, proven per vendor by a committed fixture; a documented
      OpenTelemetry Collector recipe wires the fan-out that carries such an export into AgentCE's
      ingest path in a real deployment.
    status: built
    pages:
      - website/src/content/docs/docs/trace-store-connectors.md
    check:
      workflow: .github/workflows/ci.yml
      job: integration-breadth
      description: >-
        Runs tools/trace_store_ingest_check.py: each of the four new fixtures ingests and validates
        with zero quarantines through the unmodified otel-genai adapter, the support matrix stays
        consistent, and each Collector recipe shares the byte-identical base otlp receiver, carries a
        file exporter alongside its cited vendor exporter, and names a dated source.
  - id: integrations.grc-connectors
    text: >-
      Documented recipes connect an AgentCE assessment to four GRC platforms: RegScale and ServiceNow
      GRC consume the engine's existing, schema-validated OSCAL Assessment Results output directly
      through their own native OSCAL import; Vanta and Drata, which have no native OSCAL import,
      receive a new deterministic evidence-export transform shaped to their generic evidence-submission
      APIs.
    status: built
    pages:
      - website/src/content/docs/docs/grc-connectors.md
    check:
      workflow: .github/workflows/ci.yml
      job: integration-breadth
      description: >-
        Runs tools/grc/evidence_export.py's self-test (a real assertions.json produces a byte-identical
        evidence.json across two runs; malformed input is refused, never partially written) and
        tools/grc_connectors_check.py (a real OSCAL Assessment Results document validates against the
        vendored NIST schema; the docs page names evidence_export.py's real module path and output
        field names, not just prose).
  - id: evaluator.redteam-probe-library
    text: >-
      The probe library spans computer-use, voice, and RAG-specific agent-modality attack scenarios
      beyond tool-calling/multi-agent, each with at least three attack-case variants a probe proves it
      catches by exact case-id identity (recall 1.0) with zero false positives on any safe case,
      alongside the existing >= 0.75 (Phase 1) mutation-score floor on the evaluator core, checked
      against the real, committed engines/python/mutation.json score.
    status: built
    pages:
      - conformance/README.md
    check:
      workflow: .github/workflows/ci.yml
      job: domain-depth
      description: >-
        Runs redteam_probe_check.py --self-test (loads corpus/probe/redteam/{computer-use,voice,rag}/v1
        via the real agentce.probe.load_corpus/evaluate_probe, asserts recall 1.0 by exact case-id set
        identity against each manifest's attack-* ids, and asserts every modality-specific structural
        marker) and mutation_check.py --self-test (reads the tracked engines/python/mutation.json score
        and asserts it is >= 0.75).
  - id: operability.performance-at-scale
    text: >-
      A fresh performance measurement (a synthetic-stream extrapolation to the SPEC 8.6 scale targets)
      or a documented ADR gap is recorded on every run, the same measured-or-ADR pattern Phase 3
      established -- this records a result each run, it does not itself raise the measured scale or
      newly demonstrate at-scale performance beyond Phase 3.
    status: built
    pages:
      - conformance/README.md
    check:
      workflow: .github/workflows/ci.yml
      job: domain-depth
      description: >-
        Runs perf_gate_check.py --self-test then perf_gate_check.py: a fresh perf.py --run (no --out
        override) followed by perf.py --check, which passes on a within-targets recorded run or on
        docs/adr/0009-performance.md's presence, and prints which path it took.
  - id: operability.air-gap-bundle
    text: >-
      The offline distribution bundle builds and verifies offline against the vendored trust root with
      networking disabled, carrying every published, signed base catalog (EU AI Act and NIST AI RMF);
      this proves the release, catalog, and ECS-run offline path, not a fresh dependency install into a
      clean environment -- that remains the container/quickstart path exercised at GA.
    status: built
    pages:
      - conformance/README.md
    check:
      workflow: .github/workflows/ci.yml
      job: domain-depth
      description: >-
        Runs conformance/tests/test_offline_bundle.py (build/verify, the multi-catalog assertion, and
        the tampered-second-catalog and missing-catalog negative cases) and the tools-side wrapper,
        uv run --project tools --frozen python -m offline_bundle --verify --no-network, which builds a
        fresh bundle to a temp directory and verifies it offline under dead proxies.
  - id: governance.catalog-registry
    text: >-
      Every published, signed base catalog is listed in a machine-validated registry that recomputes
      its digest and refuses a rebranded or edited entry.
    status: built
    pages:
      - conformance/registry/README.md
    check:
      workflow: .github/workflows/ci.yml
      job: domain-depth
      description: >-
        Runs catalog_registry_check.py --self-test: validates conformance/registry/catalogs.json
        against catalog-registry.schema.json, recomputes each entry's digest from the real catalog
        directory on disk, verifies the signature against the vendored trust root, and refuses a
        digest-mismatched fixture entry.
  - id: evaluator.acf-scorecard
    text: >-
      AgentCE publishes its own honest score against the Agent Conformance Framework's seven
      dimensions on a 0-3 maturity scale (an unverifiable claim scores below an honest partial), with
      a resolvable evidence pointer for every capability scored Complete, deterministically
      recomputed and gated so a published score can never silently fall.
    status: built
    pages:
      - conformance/acf/README.md
    check:
      workflow: .github/workflows/ci.yml
      job: domain-depth
      description: >-
        Runs acf_matrix_check.py --self-test and --check-fixtures (every tested capability's proof
        reproduces its committed golden outcome twice in a row) and acf_score.py --self-test (the
        scoring rule, serialization determinism, and the score-only-rises ratchet each discriminate)
        and acf_score.py (recomputes the live scorecard and refuses, exit 1, if any capability's score
        fell versus the committed conformance/acf/scorecard.json).
  - id: governance.implementation-report-registry
    text: >-
      Every accepted implementation report validates against a JSON Schema before its golden-revision
      signature and conformance claim are checked, and a schema-invalid report is refused before
      signature verification is attempted.
    status: built
    pages:
      - conformance/registry/README.md
    check:
      workflow: .github/workflows/ci.yml
      job: domain-depth
      description: >-
        Runs registry_check.py --self-test: a well-formed report is listed, a report with an
        unverifiable golden digest is refused, and a report missing the schema-required claim field is
        refused with a distinct schema-invalid status before signature verification is attempted.
