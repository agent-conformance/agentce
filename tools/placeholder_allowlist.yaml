# Placeholder-sweep allowlist (see ADR-0011). tools/placeholder_sweep.py scans every tracked file
# for stub and placeholder markers; every hit must appear here with an exact count, a class, and a
# justification, or the sweep fails.
#
#   class: legitimate  A permanent, honest placeholder: a catalog entry labelled status: placeholder,
#                      illustrative user-fill-in scaffolding, a named test double, or a genesis
#                      all-zero hash-chain pointer in a fixture. These stay.
#   class: debt        A known defect awaiting its fix. A debt entry is removed by the change that
#                      fixes it; the debt total may only fall, and the extended end-to-end gate
#                      requires it to reach zero.
#
# count is the exact number of occurrences expected. Change the content and the count moves, so the
# sweep fails until this file is updated in step -- that is the point: the allowlist stays honest.
# The scanner excludes its own source, this allowlist, and its self-test fixtures, which necessarily
# name every pattern.
version: 1
allow:
  - path: .github/pull_request_template.md
    pattern: empty-md-section
    count: 1
    class: legitimate
    justification: "PR template: the ADRs section is a blank form field an author fills in per pull request."

  - path: .github/workflows/ci.yml
    pattern: placeholder
    count: 4
    class: legitimate
    justification: "Job names that build the pre-GA placeholder distribution packages (python-placeholders, node-placeholders)."

  - path: SECURITY.md
    pattern: placeholder
    count: 1
    class: legitimate
    justification: "States that the pre-GA 0.0.x packages are placeholders that contain no functionality."

  - path: adapters/mcp-gateway/tests/test_adapter.py
    pattern: zero-digest
    count: 2
    class: legitimate
    justification: "Synthetic all-zero MCP tool-call id in the adapter test's expected output."

  - path: conformance/release.py
    pattern: stub
    count: 4
    class: legitimate
    justification: "StubRegistry: a deliberate test double that proves the release dry-run never publishes."

  - path: conformance/release_dryrun.py
    pattern: stub
    count: 1
    class: legitimate
    justification: "Describes the release dry-run's stub registry (proves no publish happens)."

  - path: corpus/quickstart/evidence/events/_benign-quarantine.jsonl
    pattern: zero-digest
    count: 2
    class: legitimate
    justification: "Genesis all-zero prev pointer in the corpus evidence hash chain (no predecessor block)."

