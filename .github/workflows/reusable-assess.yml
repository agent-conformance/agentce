# A workflow_call reusable workflow: the one-line adoption path for a consumer who wants a full job
# (checkout, engine sync, assess, SARIF upload) rather than a single composite-action step. Checks out
# the calling repository (for the evidence bundle) and a pinned commit of this repository (for the
# engine) separately, since a reusable workflow — unlike a composite action — has no implicit access to
# its own repository's files.
name: reusable-assess

on:
  workflow_call:
    inputs:
      agentce-ref:
        description: the agent-conformance/agentce commit SHA to run assess from
        required: true
        type: string
      bundle:
        description: the evidence bundle directory, relative to the calling repository's root
        required: true
        type: string
      profile:
        description: the applicability profile file, relative to the calling repository's root
        required: true
        type: string
      domain:
        description: the domain ontology binding file, relative to the calling repository's root
        required: true
        type: string
      catalog:
        description: "catalog ids, comma-separated: <id@ver>[,<id@ver>...] (default: the profile's catalogs)"
        required: false
        type: string
        default: ""
      fail-on:
        description: a --fail-on expression scoping which assertions fail the build
        required: false
        type: string
        default: ""
      out:
        description: the output directory for assertions.json, results.sarif, report.md, and the rest
        required: false
        type: string
        default: "./out"

permissions:
  contents: read
  security-events: write

jobs:
  assess:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the calling repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Checkout the AgentCE engine at the pinned commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: agent-conformance/agentce
          ref: ${{ inputs.agentce-ref }}
          path: .agentce-engine

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run agentce assess
        env:
          # Bound to env vars, never interpolated directly into the script (same rule as the
          # composite action): a value with shell metacharacters must not reach the runner's shell.
          AGENTCE_BUNDLE: ${{ inputs.bundle }}
          AGENTCE_PROFILE: ${{ inputs.profile }}
          AGENTCE_DOMAIN: ${{ inputs.domain }}
          AGENTCE_CATALOG: ${{ inputs.catalog }}
          AGENTCE_FAIL_ON: ${{ inputs.fail-on }}
          AGENTCE_OUT: ${{ inputs.out }}
        run: |
          set -e
          set -- --bundle "$AGENTCE_BUNDLE" --profile "$AGENTCE_PROFILE" --domain "$AGENTCE_DOMAIN" --out "$AGENTCE_OUT"
          if [ -n "$AGENTCE_CATALOG" ]; then set -- "$@" --catalog "$AGENTCE_CATALOG"; fi
          if [ -n "$AGENTCE_FAIL_ON" ]; then set -- "$@" --fail-on "$AGENTCE_FAIL_ON"; fi
          uv run --project .agentce-engine/engines/python --frozen agentce assess "$@"

      - name: Upload results.sarif to code scanning
        # Runs even when the step above exits non-zero (the gate firing on a real finding).
        if: always()
        uses: github/codeql-action/upload-sarif@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3
        with:
          sarif_file: ${{ inputs.out }}/results.sarif
