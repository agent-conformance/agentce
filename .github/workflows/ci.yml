# Repository hygiene and offline checks. Real engine/adapter/corpus jobs are added as those
# components land. Every action is pinned by commit SHA (AGENTS.md quality gates).
name: ci

on:
  push:
    branches: [main, "phase/**"]
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    # The external-contributor lane's required check (docs/adr/0019): every commit in the pushed or
    # pull-requested range carries a Signed-off-by whose email matches its own author -- the standard
    # DCO rule, contributor-identity-agnostic, so it runs the same way for a fork PR as for the
    # maintainer's own branch. Needs no secret and no private checkout, so it is safe on fork pull
    # requests under the default `pull_request` trigger.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # A bare pull_request checkout puts GitHub's synthetic, sign-off-less test-merge commit
          # (refs/pull/N/merge) at HEAD, which would always fail this check for a reason that has
          # nothing to do with the contributor's own commits. Pin HEAD to the real PR head instead.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0 # need the base commit to enumerate the pushed/PR commit range
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Fetch main (so an unresolvable base can fall back to a merge-base, never a silent pass)
        run: git fetch --no-tags origin main:refs/remotes/origin/main
      - name: dco_check self-test (proves detection has teeth)
        run: python tools/dco_check.py --self-test
      - name: Determine the commit range
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "DCO_BASE=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_ENV"
          else
            echo "DCO_BASE=${{ github.event.before }}" >> "$GITHUB_ENV"
          fi
      - name: Every commit in the range carries a matching Signed-off-by
        run: python tools/dco_check.py --diff "$DCO_BASE"

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Guardrails
        run: |
          set -e
          if git ls-files | grep -E '(^|/)SPEC[.S]'; then
            echo "::error::A specification source is tracked; specification sources must stay out of the repository until GA." >&2; exit 1
          fi
          test -f LICENSE || { echo "::error::LICENSE missing" >&2; exit 1; }
          test -f SECURITY.md || { echo "::error::SECURITY.md missing" >&2; exit 1; }
          lines=$(wc -l < README.md); if [ "$lines" -gt 40 ]; then echo "::error::Root README exceeds the pre-GA minimal size ($lines lines)" >&2; exit 1; fi
          echo "guardrails ok"

      - name: Governance text and the quickstart gate
        run: |
          set -e
          python3 tools/governance_check.py --self-test
          python3 tools/governance_check.py

      - name: Release state and workflow pins
        run: |
          set -e
          python3 tools/release_state_check.py --self-test
          python3 tools/release_state_check.py
          python3 tools/workflow_pins_check.py --self-test
          python3 tools/workflow_pins_check.py

      - name: Container recipe
        run: |
          set -e
          python3 tools/container_recipe_check.py --self-test
          python3 tools/container_recipe_check.py

  no-network:
    # Real offline guarantee: run an actual assessment inside a network namespace that has no route
    # off the host. Dependencies are synced online first; the assessment itself runs with networking
    # disabled, and the job fails if the namespace can still reach the network. This proves the
    # offline invariant by behaviour, not by a stand-in computation.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Sync the engine (online, before isolation)
        working-directory: engines/python
        run: uv sync --frozen
      - name: Assess with networking disabled
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/offline-report"
          # `sudo unshare -n` gives a fresh network namespace whose only interface is a down
          # loopback: no default route, no way off the host. It needs no user-namespace privileges.
          sudo unshare -n bash -euo pipefail -c '
            cd engines/python
            # Fail loudly unless the namespace is genuinely offline, so a leak can never pass silently.
            if timeout 5 bash -c "exec 3<>/dev/tcp/1.1.1.1/53" 2>/dev/null; then
              echo "::error::network reachable inside the isolated namespace; offline proof invalid" >&2
              exit 1
            fi
            ./.venv/bin/agentce quickstart --out "$1"
          ' _ "$out"
          test -e "$out"
          echo "no-network ok: assessment completed with networking disabled"

  yaml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Validate YAML files
        run: |
          python -m pip install --quiet pyyaml
          python - <<'PY'
          import sys, glob, yaml
          files = (glob.glob(".github/**/*.yml", recursive=True)
                   + glob.glob("spec/**/*.y*ml", recursive=True)
                   + glob.glob("skills/**/*.y*ml", recursive=True))
          bad = []
          for f in files:
              try:
                  yaml.safe_load(open(f))
              except Exception as e:
                  bad.append((f, str(e)))
          for f, e in bad:
              print(f"::error file={f}::{e}")
          print(f"validated {len(files)} YAML files")
          sys.exit(1 if bad else 0)
          PY

  corpus:
    # The simulated corpus backs every accuracy claim, so it must be a set of valid inputs and its
    # dataset pin must freeze what it names: every generated applicability profile validates against
    # the applicability-profile schema, and the pin covers the ground truth and the profiles, not only
    # the evidence bundles. The pin is verified against a freshly generated corpus.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Lint
        run: |
          uv run --project corpus --frozen ruff check corpus
          uv run --project corpus --frozen ruff format --check corpus
      - name: Test (profile validity, the pin, the generator, the ground truth)
        working-directory: corpus
        run: uv run --frozen pytest -q
      - name: The dataset pin holds for a freshly generated corpus
        run: uv run --project corpus --frozen python -m corpus.check_versions --corpus corpus

  corpus-gate:
    # The held-out and adversarial subsets must be a genuine blind check on the engine, not
    # relabelled twins of core projects, and the precision/recall release gate must never let a
    # reader believe "recall 1.0 / FPR 0.0" covers more of the base catalog than it actually scores
    # (SPEC §11.2, §11.6). Each check runs the real generator/gate over the committed sources.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Held-out/adversarial recipes are disjoint from the core set
        working-directory: corpus
        run: uv run --frozen pytest -q generator/tests/test_generate.py::test_held_out_and_adversarial_recipes_are_disjoint_from_core
      - name: Precision/recall gate states its honest scope
        working-directory: conformance
        run: uv run --frozen pytest -q tests/test_precision_gate.py::test_scope_is_stated_and_accurate_in_the_readme

  examples:
    # The framework examples and the integration pages must not claim more than is built: the check
    # runs the real `agentce_emit.auto()` and requires every example and page to say automatic
    # framework capture is on the roadmap while that captures nothing; the examples themselves must
    # still run and emit bundles that validate with zero quarantines.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: examples_check self-test
        run: uv run --project engines/python-emit --frozen python tools/examples_check.py --self-test
      - name: Examples and integration pages state what is built
        run: uv run --project engines/python-emit --frozen python tools/examples_check.py
      - name: Run every example and validate its bundle
        run: uv run --project examples --frozen python examples/run_all.py --check

  python-tests:
    # AgentCESpanProcessor/instrument() (SPEC 13.4 AX-3): a real OTel SpanProcessor-shaped bridge over
    # the existing otel-genai mapping, plus the one-line auto() integration declaring a session on its
    # own. Also proves the five framework examples (LangGraph, the OpenAI Agents SDK, CrewAI, Google
    # ADK, the Claude Agent SDK) really run their named framework, offline and keyless, each in its own
    # environment, and that the no-ml scan stays honest once those frameworks are actually installed.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: agentce-emit unit tests (AgentCESpanProcessor, instrument(), auto() self-capture)
        working-directory: engines/python-emit
        run: uv run --frozen pytest -q -p no:cacheprovider
      - name: framework_examples_check self-test
        run: uv run --project engines/python --frozen python tools/framework_examples_check.py --self-test
      - name: Every framework example really runs its framework, offline and keyless
        run: uv run --project engines/python --frozen python tools/framework_examples_check.py

  policy-gating:
    # Policy-as-code (SPEC §8.5): every assertion carries a real, catalog-derived severity and
    # family, and `agentce assess --fail-on <expr>` gates the exit code on a tiny, deterministic
    # expression -- never `eval`. A hostile expression (a dunder-import call, a backtick-embedded
    # shell command, a bare os.system call, or a well-formed clause with an evaluable tail) is
    # refused at exit 3 with a stable input.fail_on* key and never executed; a Rego/Conftest and a
    # Kyverno example both gate assertions.json on the same fields.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Sync the engine
        working-directory: engines/python
        run: uv sync --frozen
      - name: Policy-as-code gating (severity/family, --fail-on, policy examples)
        working-directory: engines/python
        run: uv run --frozen pytest -q -p no:cacheprovider tests/test_policy_gating.py

  collect-honesty:
    # `agentce collect` has no source connector, so the pages and the example config that introduce it
    # must say so: the check runs the real command against the shipped config and fails when the
    # command page, the integration guide, or the config presents it as pulling evidence.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: collect_check self-test
        run: uv run --project engines/python --frozen python tools/collect_check.py --self-test
      - name: The collect pages and example config state what is built
        run: uv run --project engines/python --frozen python tools/collect_check.py

  collect-ingest:
    # `agentce ingest` turns a real, committed adapter export into a bundle `agentce validate`
    # accepts, and a real `agentce collect` run against the shipped example config completes every
    # source by reading its local export -- both without a live connector. An ADR names the
    # OpenTelemetry Collector recipe that produces such an export and points at a real artifact.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Sync the engine
        working-directory: engines/python
        run: uv sync --frozen
      - name: Sync the exercised adapters
        run: |
          for adapter in otel-genai mcp-gateway policy-engines; do
            (cd "adapters/$adapter" && uv sync --frozen)
          done
      - name: collect_ingest_check self-test
        run: uv run --project engines/python --frozen python tools/collect_ingest_check.py --self-test
      - name: ingest, collect, and the collector component all work
        run: uv run --project engines/python --frozen python tools/collect_ingest_check.py

  integration-breadth:
    # Item 16.3: AutoGen, LlamaIndex, Semantic Kernel, Bedrock Agents, and Vertex Agents each really
    # run their named SDK offline and keyless; Langfuse, Phoenix/Arize, Datadog LLM Observability, and
    # LangSmith telemetry round-trips into canonical events through the existing otel-genai adapter;
    # RegScale, ServiceNow, Vanta, and Drata each have a real, cited connector recipe. Each new
    # example syncs its own isolated uv environment on demand (via its own run.sh, matching the
    # python-tests job's existing five-framework-example pattern); this job installs none of them
    # itself.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Sync the engine
        working-directory: engines/python
        run: uv sync --frozen
      - name: Sync tools
        working-directory: tools
        run: uv sync --frozen
      - name: Sync the otel-genai adapter
        working-directory: adapters/otel-genai
        run: uv sync --frozen
      - name: framework_examples_check self-test
        run: uv run --project engines/python --frozen python tools/framework_examples_check.py --self-test
      - name: All ten framework examples really run their framework, offline and keyless
        run: uv run --project engines/python --frozen python tools/framework_examples_check.py
      - name: framework_examples_check chokepoint documentation
        run: uv run --project engines/python --frozen python tools/framework_examples_check.py --doc-symbols-only
      - name: trace_store_ingest_check self-test
        run: uv run --project engines/python --frozen python tools/trace_store_ingest_check.py --self-test
      - name: Langfuse, Phoenix, Datadog, and LangSmith telemetry round-trips into AgentCE
        run: uv run --project engines/python --frozen python tools/trace_store_ingest_check.py
      - name: trace_store_ingest_check recipes self-test
        run: uv run --project engines/python --frozen python tools/trace_store_ingest_check.py --recipes-only --self-test
      - name: The Collector recipes are real and structurally sound
        run: uv run --project engines/python --frozen python tools/trace_store_ingest_check.py --recipes-only
      - name: grc/evidence_export.py self-test
        run: uv run --project tools --frozen python tools/grc/evidence_export.py --self-test
      - name: grc_connectors_check self-test
        run: uv run --project engines/python --frozen python tools/grc_connectors_check.py --self-test
      - name: RegScale/ServiceNow's OSCAL path and Vanta/Drata's evidence-export path both hold
        run: uv run --project engines/python --frozen python tools/grc_connectors_check.py
      - name: integration_breadth_check self-test
        run: uv run --project tools --frozen python -m integration_breadth_check --self-test
      - name: integration_breadth_check (real, aggregated)
        run: uv run --project tools --frozen python -m integration_breadth_check

  evidence-input-hardening:
    # An evidence bundle's manifest, YAML files, and event lines are adversarial input (SPEC §8.1,
    # §8.7; docs/threat-model.md "Untrusted evidence-bundle input hardening"). A manifest-listed path
    # that resolves outside the bundle root (a symlink escape), a disallowed YAML construct, and a
    # pathologically deep YAML or JSON structure must all be refused with a deliberate input.* key or
    # quarantine reason -- never fall through to the generic internal.unexpected catch-all. Runs a
    # small deterministic fuzz corpus over each hazard class, not just one hand-picked fixture.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Sync the engine
        working-directory: engines/python
        run: uv sync --frozen
      - name: Untrusted evidence-bundle input hardening
        working-directory: engines/python
        run: uv run --frozen pytest -q -p no:cacheprovider tests/test_input_hardening.py

  report-hardening:
    # report.html is safe to open in every engine (SPEC §9.3): a hostile subject id can only ever
    # render as escaped text, a strict Content-Security-Policy is present, and the existing, unchanged
    # WCAG/self-containment structural bar (render_check.py::_html_is_hardened) passes for Python,
    # TypeScript, and Java alike. Also proves the TypeScript --language parameter genuinely varies the
    # rendering while leaving assertions.json untouched.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Sync the Python engine
        working-directory: engines/python
        run: uv sync --frozen
      - name: Install and build the TypeScript engine
        working-directory: engines/typescript
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm build
      - name: Report hardening across all three engines
        working-directory: conformance
        run: uv run --project ../engines/python --frozen python report_hardening_check.py

  python-placeholders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Build Python placeholders
        run: |
          python -m pip install --quiet --upgrade build
          for d in engines/python engines/python-alias engines/python-emit; do
            [ -f "$d/pyproject.toml" ] && python -m build --outdir /tmp/dist "$d"
          done
          ls /tmp/dist

  node-placeholders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Check Node placeholders
        run: |
          for d in engines/typescript engines/typescript-alias engines/typescript-emit; do
            if [ -f "$d/package.json" ]; then
              (cd "$d" && node -e "require('./package.json')" && npm pack --dry-run >/dev/null && echo "$d ok")
            fi
          done
          node engines/typescript/bin/agentce.js --version

  python-install-matrix:
    # Proves the one documented command works off the maintainer's own architecture. The pinned,
    # advisory-clean cryptography publishes prebuilt wheels for Linux and Apple-silicon macOS but none
    # for Intel macOS, where the install compiles it from source; each leg installs the engine from
    # the frozen lockfile, checks `agentce doctor` reports the wheel provenance the docs state for
    # that platform, and runs the quickstart to a report.
    name: python-install-matrix (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            wheel: prebuilt
          - os: macos-latest
            wheel: prebuilt
          - os: macos-15-intel
            wheel: source-build
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Provide OpenSSL 3 for the source build (Intel macOS)
        if: matrix.wheel == 'source-build'
        run: |
          brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
          echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
      - name: Sync the engine (frozen lockfile)
        working-directory: engines/python
        run: uv sync --frozen
      - name: Doctor reports the toolchain the docs describe
        env:
          EXPECTED_WHEEL: ${{ matrix.wheel }}
        run: |
          set -euo pipefail
          uv run --project engines/python --frozen agentce doctor --project corpus/quickstart --json > "$RUNNER_TEMP/doctor.json"
          python3 - "$RUNNER_TEMP/doctor.json" <<'PY'
          import json, os, sys
          doc = json.load(open(sys.argv[1]))
          env = doc["environment"]
          got = env["cryptography"]["wheel_source"]
          print(f"python {env['python']['version']} on {env['platform']['system']} {env['platform']['machine']}; "
                f"cryptography {env['cryptography']['version']} ({got}), {env['cryptography']['openssl']}")
          assert doc["healthy"], doc["problems"]
          assert got == os.environ["EXPECTED_WHEEL"], f"expected a {os.environ['EXPECTED_WHEEL']} cryptography, got {got}"
          PY
      - name: Quickstart to a report
        run: |
          set -euo pipefail
          uv run --project engines/python --frozen agentce quickstart --out "$RUNNER_TEMP/report"
          test -s "$RUNNER_TEMP/report/assertions.json"

  agent-skill-tests:
    # The generated agent-skill output (`assess --emit skill`, SPEC §7/§13.3, Appendix A2 (C)) and the
    # two approved skills' standalone installability. A regression in the skill emitter's structure,
    # its injection hardening (escaping and length-capping a second evidence-derived-string category,
    # tool names), or either skill's vendored-dependency install fails this job.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Sync the engine
        working-directory: engines/python
        run: uv sync --frozen
      - name: Skill-emitter unit tests
        working-directory: engines/python
        run: uv run --frozen pytest -q -p no:cacheprovider tests/test_skill_emit.py tests/test_remediation.py
      - name: Every skill's vendored engine wheel matches a fresh build (self-test then check)
        run: |
          python3 tools/vendor_skill_engine.py --self-test
          python3 tools/vendor_skill_engine.py
      - name: agentce-onboard runs standalone, no sibling engines/ checkout
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          cp -R skills/agentce-onboard "$work/installed-skill"
          rm -rf "$work/installed-skill/.venv" "$work/installed-skill/.mypy_cache" "$work/installed-skill/.ruff_cache" "$work/installed-skill/__pycache__"
          cd "$work/installed-skill"
          out="$(uv run --frozen python3 scripts/lint_profile.py --self-test --json)"
          echo "$out"
          echo "$out" | grep -q '"self_test": "ok"'
      - name: agentce-check-report runs standalone, no sibling engines/ checkout
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          cp -R skills/agentce-check-report "$work/installed-skill"
          rm -rf "$work/installed-skill/.venv" "$work/installed-skill/.mypy_cache" "$work/installed-skill/.ruff_cache" "$work/installed-skill/__pycache__"
          cd "$work/installed-skill"
          uv run --frozen pytest -q -p no:cacheprovider

  reusable-ci-artifacts:
    # A platform team gates a build on an AgentCE assessment through one of three artifacts: the
    # composite GitHub Action, the workflow_call reusable workflow, or the GitLab CI/CD component. This
    # job proves each is real (valid YAML, the real shape, the fail-on input wired through to a real
    # `agentce assess` invocation, results.sarif exposed, every third-party action pinned by commit SHA)
    # rather than a declared-but-unused input.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: reusable_ci_artifacts_check self-test
        run: uv run --project tools --frozen python tools/reusable_ci_artifacts_check.py --self-test
      - name: The composite action, the reusable workflow, and the GitLab component are real
        run: uv run --project tools --frozen python tools/reusable_ci_artifacts_check.py

  contributor-lane:
    # A newcomer's first three trust signals: CONTRIBUTING.md's documented commands genuinely test
    # the code (observed by running them and requiring them to catch a seeded broken test and a
    # seeded lint violation in the reference engine, never by parsing the shell), a real Code of
    # Conduct with no fabricated enforcement contact, and real GitHub issue/pull-request templates.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Sync the reference engine (engines/python)
        working-directory: engines/python
        run: uv sync --frozen
      - name: contributing_doctest_check self-test
        run: uv run --project tools --frozen python tools/contributing_doctest_check.py --self-test
      - name: CONTRIBUTING.md's documented commands genuinely run pytest and ruff
        run: uv run --project tools --frozen python tools/contributing_doctest_check.py
      - name: code_of_conduct_check self-test
        run: uv run --project tools --frozen python tools/code_of_conduct_check.py --self-test
      - name: Code of Conduct and contribution templates are real
        run: uv run --project tools --frozen python tools/code_of_conduct_check.py

  domain-depth:
    # Item 16.4: richer red-team/modality probe coverage (computer-use, voice, RAG) with recall 1.0
    # proven by set identity, the evaluator's mutation-score floor read from the real, committed
    # mutation.json, a fresh performance measurement or documented ADR gap on every run, the air-gap
    # bundle carrying every signed base catalog and verifying each offline, and the catalog and
    # implementation-report registries, each validated against a JSON Schema.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Sync the reference engine (engines/python)
        working-directory: engines/python
        run: uv sync --frozen
      - name: Sync conformance
        working-directory: conformance
        run: uv sync --frozen
      - name: Sync tools
        working-directory: tools
        run: uv sync --frozen
      - name: redteam_probe_check self-test (computer-use, voice, and RAG probe corpora; recall 1.0)
        working-directory: conformance
        run: uv run --frozen python redteam_probe_check.py --self-test
      - name: mutation_check self-test (the Phase-1 mutation-score floor, read from mutation.json)
        working-directory: conformance
        run: uv run --frozen python mutation_check.py --self-test
      - name: perf_gate_check self-test
        working-directory: conformance
        run: uv run --frozen python perf_gate_check.py --self-test
      - name: perf_gate_check (a fresh measurement or the documented ADR gap, on this run)
        working-directory: conformance
        run: uv run --frozen python perf_gate_check.py
      - name: test_offline_bundle.py (multi-catalog build/verify, including the tampered-catalog cases)
        working-directory: conformance
        run: uv run --frozen python -m pytest tests/test_offline_bundle.py -q
      - name: The air-gap bundle builds fresh and verifies offline, with networking disabled
        run: uv run --project tools --frozen python -m offline_bundle --verify --no-network
      - name: catalog_registry_check self-test (the catalog registry, both catalogs, schema-validated)
        working-directory: conformance
        run: uv run --frozen python catalog_registry_check.py --self-test
      - name: registry_check self-test (the implementation-report registry, now schema-validated too)
        working-directory: conformance
        run: uv run --frozen python registry_check.py --self-test
      - name: acf_matrix_check self-test (the ACF matrix schema and structural rules discriminate)
        working-directory: conformance
        run: uv run --frozen python acf_matrix_check.py --self-test
      - name: acf_matrix_check --check-fixtures (every capability's test reproduces its golden outcome)
        working-directory: conformance
        run: uv run --frozen python acf_matrix_check.py --check-fixtures
      - name: acf_score self-test (the scoring rule, serialization determinism, and the ratchet discriminate)
        working-directory: conformance
        run: uv run --frozen python acf_score.py --self-test
      - name: acf_score (the honest ACF scorecard; the score-only-rises ratchet against the committed baseline)
        working-directory: conformance
        run: uv run --frozen python acf_score.py
