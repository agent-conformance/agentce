# Repository hygiene and offline checks. Real engine/adapter/corpus jobs are added as those
# components land. Every action is pinned by commit SHA (AGENTS.md quality gates).
name: ci

on:
  push:
    branches: [main, "phase/**"]
  pull_request:

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Guardrails
        run: |
          set -e
          if git ls-files | grep -E '(^|/)SPEC[.S]'; then
            echo "::error::A specification source is tracked; specification sources must stay out of the repository until GA." >&2; exit 1
          fi
          test -f LICENSE || { echo "::error::LICENSE missing" >&2; exit 1; }
          test -f SECURITY.md || { echo "::error::SECURITY.md missing" >&2; exit 1; }
          lines=$(wc -l < README.md); if [ "$lines" -gt 40 ]; then echo "::error::Root README exceeds the pre-GA minimal size ($lines lines)" >&2; exit 1; fi
          echo "guardrails ok"

  no-network:
    # Real offline guarantee: run an actual assessment inside a network namespace that has no route
    # off the host. Dependencies are synced online first; the assessment itself runs with networking
    # disabled, and the job fails if the namespace can still reach the network. This proves the
    # offline invariant by behaviour, not by a stand-in computation.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Sync the engine (online, before isolation)
        working-directory: engines/python
        run: uv sync --frozen
      - name: Assess with networking disabled
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/offline-report"
          # `sudo unshare -n` gives a fresh network namespace whose only interface is a down
          # loopback: no default route, no way off the host. It needs no user-namespace privileges.
          sudo unshare -n bash -euo pipefail -c '
            cd engines/python
            # Fail loudly unless the namespace is genuinely offline, so a leak can never pass silently.
            if timeout 5 bash -c "exec 3<>/dev/tcp/1.1.1.1/53" 2>/dev/null; then
              echo "::error::network reachable inside the isolated namespace; offline proof invalid" >&2
              exit 1
            fi
            ./.venv/bin/agentce quickstart --out "$1"
          ' _ "$out"
          test -e "$out"
          echo "no-network ok: assessment completed with networking disabled"

  yaml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Validate YAML files
        run: |
          python -m pip install --quiet pyyaml
          python - <<'PY'
          import sys, glob, yaml
          files = (glob.glob(".github/**/*.yml", recursive=True)
                   + glob.glob("spec/**/*.y*ml", recursive=True)
                   + glob.glob("skills/**/*.y*ml", recursive=True))
          bad = []
          for f in files:
              try:
                  yaml.safe_load(open(f))
              except Exception as e:
                  bad.append((f, str(e)))
          for f, e in bad:
              print(f"::error file={f}::{e}")
          print(f"validated {len(files)} YAML files")
          sys.exit(1 if bad else 0)
          PY

  python-placeholders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Build Python placeholders
        run: |
          python -m pip install --quiet --upgrade build
          for d in engines/python engines/python-alias engines/python-emit; do
            [ -f "$d/pyproject.toml" ] && python -m build --outdir /tmp/dist "$d"
          done
          ls /tmp/dist

  node-placeholders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Check Node placeholders
        run: |
          for d in engines/typescript engines/typescript-alias engines/typescript-emit; do
            if [ -f "$d/package.json" ]; then
              (cd "$d" && node -e "require('./package.json')" && npm pack --dry-run >/dev/null && echo "$d ok")
            fi
          done
          node engines/typescript/bin/agentce.js --version
