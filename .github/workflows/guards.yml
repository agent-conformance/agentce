# Server-side guards that were previously enforced only by the maintainer's local git hooks:
#   - leak-guard: no private term in added file content or a commit message, and no commit-denylisted
#     term in a commit message -- matched against salted digests, so neither list is ever disclosed.
#   - spec-validators: the evidence vocabulary and the worked examples stay internally consistent.
#   - catalog-lint: every base catalog lints clean (schema, shapes, test-case outcomes, provenance);
#     a catalog built from a companion crosswalk file substantiates every crosswalk claim it makes; the
#     bring-your-own catalog-authoring toolkit rejects a forbidden SHACL construct; and every documented
#     command on the catalog-authoring page actually runs against the real CLI.
#   - runtime-conformance: a state-tracked series of real `agentce assess --state` runs detects
#     per-(subject, control) outcome drift and captures the incident evidence that caused it.
# Every action is pinned by commit SHA. Minimal permissions and the default `pull_request` trigger
# (never the privileged target-context variant, and no secrets) so this runs safely on fork pull
# requests too: the guard reads only committed salted digests, never the private lists.
name: guards

on:
  push:
    branches: [main, "phase/**"]
  pull_request:

permissions:
  contents: read

jobs:
  leak-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # need the base commit to diff added content and messages
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: leak-guard self-test (proves detection has teeth)
        run: python tools/leak_guard.py --self-test
      - name: no-disclosure self-scan of the committed guard artifacts
        run: python tools/leak_guard.py --files tools/leak_guard.py tools/leak_tokens.hashes .github/workflows/guards.yml
      - name: Determine the diff base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "LEAK_BASE=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_ENV"
          else
            echo "LEAK_BASE=${{ github.event.before }}" >> "$GITHUB_ENV"
          fi
      - name: leak-guard scan of added content and commit messages
        run: python tools/leak_guard.py --diff "$LEAK_BASE"

  spec-validators:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Validate the evidence vocabulary (check_vocab.py)
        run: uv run --project spec/vocab --frozen python spec/vocab/check_vocab.py
      - name: Validate the worked examples against their schemas (validate_examples.py)
        run: uv run --project spec --frozen python spec/validate_examples.py

  catalog-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Lint every base catalog (schema, shapes, test-case outcomes)
        run: |
          for dir in spec/catalogs/base/*/; do
            uv run --project engines/python --frozen agentce catalog lint --require-provenance "$dir"
          done
      - name: nist-ai-rmf substantiates every crosswalk claim it makes (self-test, then the real catalog)
        run: |
          uv run --project tools --frozen python -m nist_catalog_substantiation_check --self-test
          uv run --project tools --frozen python -m nist_catalog_substantiation_check \
            spec/catalogs/base/nist-ai-rmf spec/catalogs/base/eu-ai-act/crosswalk/nist-ai-rmf.yaml
      - name: Catalog-authoring toolkit rejects a forbidden SHACL construct (self-test)
        run: uv run --project tools --frozen python -m catalog_authoring_check --self-test
      - name: Documented catalog-authoring commands actually run (doc-test harness, page-scoped and site-wide)
        run: |
          uv run --project tools --frozen python -m docs_doctest_check --self-test
          uv run --project tools --frozen python -c "
          import sys; sys.path.insert(0, 'tools')
          from docs_doctest_check import extract
          from pathlib import Path
          p = Path('website/src/content/docs/docs/catalog-authoring.md')
          blocks = [b for b in extract(str(p), p.read_text()) if not b.error and b.no_run_reason is None]
          assert len(blocks) >= 4, f'only {len(blocks)} runnable blocks'
          "
          uv run --project tools --frozen python -m docs_doctest_check

  runtime-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Negative cases discriminate (self-test)
        working-directory: conformance
        run: uv run --frozen python runtime_conformance_check.py --self-test
      - name: The real three-step drift scenario, twice, for determinism
        working-directory: conformance
        run: uv run --frozen python runtime_conformance_check.py
      - name: This guard job is really wired (self-test, then the real check)
        working-directory: conformance
        run: |
          uv run --frozen python runtime_conformance_check.py --check-guard --self-test
          uv run --frozen python runtime_conformance_check.py --check-guard
