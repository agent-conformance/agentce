# The verification suite on every pull request, run the way anyone would run it from a fresh clone:
# the registry check, the quick tier, and each gate's seeded-fault demo. Every action is pinned by commit SHA.
name: verification

on:
  push:
    branches: [main, "phase/**"]
  pull_request:

permissions:
  contents: read

jobs:
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install the website's dependencies
        working-directory: website
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Sync the projects the gates run in
        run: |
          for project in adapters/*/; do
            if [ -f "$project/uv.lock" ]; then (cd "$project" && uv sync --frozen); fi
          done
      - name: Lint and type-check the runner
        run: |
          uv run --project tools --frozen ruff check verification/run verification/selftest.py verification/probe.py
          uv run --project tools --frozen ruff format --check verification/run verification/selftest.py verification/probe.py
          uv run --project tools --frozen mypy --strict verification/run verification/selftest.py verification/probe.py
      - name: The registry check rejects bad gates
        run: ./verification/run --lint-registry --demo-reject
      - name: The runner reports fail, skipped and pass honestly on registries the probe writes
        run: python3 verification/probe.py
      - name: Quick tier
        run: ./verification/run --quick
      - name: Every gate turns RED on its seeded fault and GREEN after restore
        run: |
          set -e
          for gate in $(./verification/run --list); do
            ./verification/run --demo-fault "$gate"
          done
