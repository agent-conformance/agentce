# The verification suite on every pull request, run the way anyone would run it from a fresh clone:
# the registry check, the quick tier, and each gate's seeded-fault demo. Every action is pinned by commit SHA.
#
# The quick tier and lint/type-check run in `build`. Every gate's seeded-fault demo runs in parallel
# across the `demo-fault` matrix, each shard computing its own slice of `./verification/run --list`
# at run time (verification/shard.py) rather than naming gates in this file, so no edit here can drop
# or sample a gate's demo (VG-DEMO-SHARD-COVERAGE guards the partition itself). `quick` stays the
# required check's name: it does no work of its own, only fails unless `build` and every demo-fault
# shard succeeded, so a failed, cancelled or skipped shard still turns the required check red.
name: verification

on:
  push:
    branches: [main, "phase/**"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-verification-env
      - name: Lint and type-check the runner
        run: |
          uv run --project tools --frozen ruff check verification/run verification/selftest.py verification/probe.py verification/shard.py
          uv run --project tools --frozen ruff format --check verification/run verification/selftest.py verification/probe.py verification/shard.py
          uv run --project tools --frozen mypy --strict verification/run verification/selftest.py verification/probe.py verification/shard.py
      - name: The registry check rejects bad gates
        run: ./verification/run --lint-registry --demo-reject
      - name: The runner reports fail, skipped and pass honestly on registries the probe writes
        run: python3 verification/probe.py
      - name: Quick tier
        run: ./verification/run --quick

  demo-fault:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # `lane` only fans out 8 parallel jobs; the partition itself uses
      # strategy.job-index/strategy.job-total below, never this list's values.
      matrix:
        lane: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-verification-env
      - name: This shard's seeded-fault demos
        run: python3 verification/shard.py "${{ strategy.job-index }}" "${{ strategy.job-total }}"

  quick:
    needs: [build, demo-fault]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require build and every demo-fault shard to have succeeded
        run: |
          if [ "${{ needs.build.result }}" != "success" ] || [ "${{ needs.demo-fault.result }}" != "success" ]; then
            echo "build: ${{ needs.build.result }}, demo-fault: ${{ needs.demo-fault.result }}"
            echo "a required job failed, was cancelled, or was skipped"
            exit 1
          fi
          echo "build and every demo-fault shard succeeded"
