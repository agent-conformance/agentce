# Cross-architecture determinism (SPEC 11.5, check P1.2): the reference engine must produce a
# byte-identical per-project manifest.json on x86_64 and arm64, excluding the run timestamp, host
# fingerprint, and operator. Every action is pinned by commit SHA (AGENTS.md quality gates).
name: determinism

on:
  push:
    branches: [main, "phase/**"]
  pull_request:

permissions:
  contents: read

jobs:
  ecs:
    name: ecs (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run the Engine Conformance Suite
        working-directory: engines/python
        run: |
          uv run --frozen agentce conformance run --engine . --corpus ../../corpus \
            --out "$RUNNER_TEMP/ecs" --json
      - name: Normalise per-project manifests
        run: |
          python3 - "$RUNNER_TEMP/ecs/projects" "$RUNNER_TEMP/normalised" <<'PY'
          import json, sys
          from pathlib import Path

          src, dst = Path(sys.argv[1]), Path(sys.argv[2])
          count = 0
          for manifest in sorted(src.rglob("manifest.json")):
              data = json.loads(manifest.read_text(encoding="utf-8"))
              run = data.get("run", {})
              # These three vary by machine and time and are excluded from the comparison (P1.2).
              for volatile in ("started_at", "host_fingerprint", "operator"):
                  run.pop(volatile, None)
              key = manifest.parent.relative_to(src).as_posix().replace("/", "__")
              out = dst / f"{key}.json"
              out.parent.mkdir(parents=True, exist_ok=True)
              out.write_text(json.dumps(data, sort_keys=True, indent=2), encoding="utf-8")
              count += 1
          if count == 0:
              raise SystemExit("no per-project manifests were produced")
          print(f"normalised {count} manifests")
          PY
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: manifests-${{ matrix.arch }}
          path: ${{ runner.temp }}/normalised
          if-no-files-found: error

  compare:
    name: compare architectures
    needs: ecs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: manifests-x86_64
          path: x86_64
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: manifests-arm64
          path: arm64
      - name: Compare manifests across architectures
        run: |
          if diff -r x86_64 arm64; then
            echo "determinism: per-project manifests are identical on x86_64 and arm64"
          else
            echo "::error::per-project manifests differ across architectures" >&2
            exit 1
          fi
