name: website

on:
  push:
    branches: [main, "phase/**"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        working-directory: website
        run: pnpm install --frozen-lockfile
      - name: Build the static site
        working-directory: website
        run: pnpm build
      - name: Resolve every canonical IRI
        working-directory: website
        run: pnpm run check:iri
      - name: Check links and structural accessibility (fast regex pre-check)
        working-directory: website
        run: node scripts/check-site.mjs
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Hero terminal equals a fresh quickstart run
        working-directory: website
        run: |
          node scripts/quickstart-hero.mjs --self-test
          node scripts/quickstart-hero.mjs

  docs-doctest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Doc-test checker self-test (good and bad page fixtures)
        run: python3 tools/docs_doctest_check.py --self-test
      - name: Every shell command on the docs site runs against the real CLI
        run: python3 tools/docs_doctest_check.py

  a11y:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        working-directory: website
        run: pnpm install --frozen-lockfile
      - name: Install the pinned Playwright browser
        working-directory: website
        run: pnpm exec playwright install --with-deps chromium
      - name: Build the static site
        working-directory: website
        run: pnpm build
      - name: Accessibility gate over every built page (axe, both themes, WCAG 2.2 AA)
        working-directory: website
        run: node scripts/check-a11y.mjs
      - name: Accessibility gate can fail (axe self-test over the inaccessible fixture)
        working-directory: website
        run: node scripts/check-a11y.mjs --self-test
