      - name: The landing page pairs a real report excerpt with its machine record
        run: |
          set -u

          rm -rf website/dist
          pnpm install --offline --frozen-lockfile
          install_exit=$?
          if [ "$install_exit" -ne 0 ]; then
            echo "pnpm install --offline --frozen-lockfile failed (exit $install_exit) -- setup, not the defect" >&2
            exit 3
          fi

          pnpm -C website build
          build_exit=$?
          if [ "$build_exit" -ne 0 ]; then
            echo "pnpm -C website build failed (exit $build_exit) -- setup, not the defect" >&2
            exit 3
          fi

          python3 - "website/dist" <<'PY'
          import re, sys
          from pathlib import Path

          dist = Path(sys.argv[1])
          index = dist / "index.html"
          if not index.is_file():
              print(f"{index}: not found -- build did not produce the landing page", file=sys.stderr)
              sys.exit(3)
          html = index.read_text(encoding="utf-8")

          # Capture each <section ...> block together with its own opening-tag attributes (unlike
          # C2/C3's scan, which only sees a section's inner content) so an aria-label placed
          # directly on the <section> tag itself -- not only an inner heading's id/aria-labelledby
          # target -- counts as a label for this section.
          section_re = re.compile(r"<section\b([^>]*)>(.*?)</section>", re.I | re.S)
          heading_re = re.compile(r"<h[1-6][^>]*>(.*?)</h[1-6]>", re.I | re.S)
          strip_tags = lambda s: re.sub(r"<[^>]+>", " ", s)

          ARTIFACT_NAMES = ("assertions.json", "results.sarif", "oscal-ar.json")


          def is_show_dont_tell_label(text):
              t = text.lower()
              if re.search(r"show[\s,]*don.?t\s+tell", t):
                  return True
              if "see it in action" in t or re.search(r"\bin action\b", t):
                  return True
              # A label that itself names the pairing (e.g. "a real finding, and its machine
              # record") without using either fixed phrase above.
              return bool(re.search(r"\bfinding\b", t) and re.search(r"\b(machine|record)\b", t))


          def has_human_part(block):
              # A labelled human-readable finding/report excerpt: an element whose class/
              # aria-label/data attribute, or its own heading, names it as the human side of the
              # pairing -- content that would come from report.md/report.html, never bare
              # unlabelled prose.
              for m in re.finditer(r"<[a-z0-9]+\b([^>]*)>", block, re.I):
                  attrs = m.group(1)
                  if re.search(r'\b(class|aria-label|data-[a-z-]+)="[^"]*\bhuman\b', attrs, re.I):
                      return True
                  if re.search(r'\b(class|aria-label|data-[a-z-]+)="[^"]*report.?excerpt', attrs, re.I):
                      return True
              for h in heading_re.findall(block):
                  htext = strip_tags(h).lower()
                  if "human" in htext or "report excerpt" in htext:
                      return True
              return False


          def machine_chunks(block):
              # A machine-record excerpt is either a <pre>/<code> block, or any element explicitly
              # labelled as the machine side (class/aria-label/data attribute naming it
              # "machine"); the full matched tag (attributes plus inner text) is kept for the
              # latter so a filename reference sitting in a caption/label beside a <pre> -- not
              # only inside it -- still counts.
              chunks = []
              for tag_re in (
                  re.compile(r"<pre\b[^>]*>(.*?)</pre>", re.I | re.S),
                  re.compile(r"<code\b[^>]*>(.*?)</code>", re.I | re.S),
              ):
                  chunks.extend(tag_re.findall(block))
              for m in re.finditer(r"<([a-z0-9]+)\b([^>]*\bmachine\b[^>]*)>(.*?)</\1>", block, re.I | re.S):
                  chunks.append(m.group(0))
              return chunks


          problems = []
          found_section = False
          for attrs, block in section_re.findall(html):
              headings = " ".join(strip_tags(h) for h in heading_re.findall(block))
              aria = " ".join(re.findall(r'aria-label(?:ledby)?="([^"]*)"', attrs + " " + block, re.I))
              if not is_show_dont_tell_label(headings + " " + aria):
                  continue
              found_section = True
              human_ok = has_human_part(block)
              mchunks = machine_chunks(block)
              hit_names = sorted({n for n in ARTIFACT_NAMES for c in mchunks if n in c.lower()})
              machine_ok = bool(hit_names)
              if human_ok and machine_ok:
                  print(
                      "GREEN: a labelled show-don't-tell section pairs a human-readable finding "
                      f"with a machine-record excerpt referencing {hit_names}"
                  )
                  sys.exit(0)
              missing = []
              if not human_ok:
                  missing.append("no labelled human-readable finding/report excerpt in this section")
              if not machine_ok:
                  missing.append(
                      "no machine-record excerpt (pre/code or labelled machine element) in this "
                      "section referencing assertions.json/results.sarif/oscal-ar.json"
                  )
              problems.append("a show-don't-tell-labelled section exists but: " + "; ".join(missing))

          if not found_section:
              problems.append(
                  "no section with a heading or aria-label conveying 'show, don't tell' / 'see it "
                  "in action' / a human-finding-beside-machine-record pairing"
              )

          print("RED:", file=sys.stderr)
          for p in problems:
              print(f"  {p}", file=sys.stderr)
          sys.exit(1)
          PY
          exit $?
      - name: The value grid and section headers are outcome-led, CTAs collapse, and a copy-paste quickstart is present
        run: |
          set -u

          # Fresh-clone-safe bootstrap (the contracts/F42.md pattern): node_modules is gitignored
          # and absent from RED capture's fresh clone of base_sha, so it is populated here from the
          # local pnpm content-addressable store with --offline (no network) rather than assumed
          # present. The build then runs at the repo root because build-iris.mjs resolves the
          # canonical-IRI sources relative to it. Three disjoint exit codes so a setup/build failure
          # can never masquerade as the defect: 3 = setup, 1 = defect present, 0 = GREEN.
          rm -rf website/dist
          pnpm install --offline --frozen-lockfile
          install_exit=$?
          if [ "$install_exit" -ne 0 ]; then
            echo "pnpm install --offline --frozen-lockfile failed (exit $install_exit) -- setup, not the defect" >&2
            exit 3
          fi

          pnpm -C website build
          build_exit=$?
          if [ "$build_exit" -ne 0 ]; then
            echo "pnpm -C website build failed (exit $build_exit) -- setup, not the defect" >&2
            exit 3
          fi

          python3 - "website/dist/index.html" <<'PY'
          import re, sys
          from pathlib import Path

          path = Path(sys.argv[1])
          if not path.is_file():
              print(f"{path}: not found -- build did not produce it (setup problem)", file=sys.stderr)
              sys.exit(3)
          html = path.read_text(encoding="utf-8")

          # "The rendered page" is scoped to <main id="main">...</main> -- the landmark every page
          # gets from BaseLayout.astro:63, which wraps index.astro's entire slotted content and
          # excludes the shared header/footer navigation (BaseLayout.astro:57-60,69-73, plain text
          # links, never styled as buttons) -- so this count can never be inflated by site-wide nav.
          main_m = re.search(r"<main\b[^>]*>(.*?)</main>", html, re.I | re.S)
          if not main_m:
              print("no <main> element found in the rendered page -- structure changed more than expected", file=sys.stderr)
              sys.exit(3)
          main = main_m.group(1)

          MAX_CTAS = 2
          anchors = re.findall(r'<a\b([^>]*)>(.*?)</a>', main, re.I | re.S)
          ctas = []
          for attrs, inner in anchors:
              cm = re.search(r'class\s*=\s*"([^"]*)"', attrs, re.I)
              classes = [c.lower() for c in (cm.group(1).split() if cm else [])]
              if "button" in classes:
                  href_m = re.search(r'href\s*=\s*"([^"]*)"', attrs, re.I)
                  text = re.sub(r"\s+", " ", re.sub(r"<[^>]+>", " ", inner)).strip()
                  ctas.append((text, href_m.group(1) if href_m else None))

          if len(ctas) > MAX_CTAS:
              print(
                  f"RED: {len(ctas)} call-to-action buttons found in <main> (want <= {MAX_CTAS}, collapsed): {ctas}",
                  file=sys.stderr,
              )
              sys.exit(1)
          print(f"GREEN: {len(ctas)} call-to-action button(s) in <main> (<= {MAX_CTAS}): {ctas}")
          sys.exit(0)
          PY
          exit $?
      - name: A clean, copy-paste-able quickstart command exists apart from the decorative terminal transcript
        run: |
          set -u

          # Fresh-clone-safe bootstrap: see C1 for the full rationale. Three disjoint exit codes:
          # 3 = setup, 1 = defect present, 0 = GREEN.
          rm -rf website/dist
          pnpm install --offline --frozen-lockfile
          install_exit=$?
          if [ "$install_exit" -ne 0 ]; then
            echo "pnpm install --offline --frozen-lockfile failed (exit $install_exit) -- setup, not the defect" >&2
            exit 3
          fi

          pnpm -C website build
          build_exit=$?
          if [ "$build_exit" -ne 0 ]; then
            echo "pnpm -C website build failed (exit $build_exit) -- setup, not the defect" >&2
            exit 3
          fi

          python3 tools/quickstart_copypaste_check.py "website/dist/index.html"
      - name: tokens.css defines a real modular type scale and a real modular spacing scale
        run: |
          set -u

          # Source-inspection only: no build needed, tokens.css is read directly. Two disjoint
          # exit codes: 3 = the file itself is missing (setup, not the defect), 1 = the file exists
          # but lacks a real scale, 0 = GREEN.
          python3 - "website/src/styles/tokens.css" <<'PY'
          import re, sys
          from pathlib import Path

          path = Path(sys.argv[1])
          if not path.is_file():
              print(f"{path}: not found -- setup problem, not the defect", file=sys.stderr)
              sys.exit(3)
          css = path.read_text(encoding="utf-8")

          # Every declared custom property (name, value). Classification is by the VALUE's shape,
          # not just the name prefix: --text-muted/--text-faint already exist today as colours
          # (hex values), so a name-prefix-only match on "text-" would wrongly count them as type
          # scale steps. A token counts only if its own value looks like a length (rem/em/px/%/
          # vw/vh/clamp()/calc()) and does NOT look like a colour (#hex/rgb()/hsl()/color-mix()).
          decl_re = re.compile(r'--([a-zA-Z][\w-]*)\s*:\s*([^;]+);')
          TYPE_PREFIX = re.compile(r'^(font-size|text|step|type-scale|fs)(-|$)', re.I)
          SPACE_PREFIX = re.compile(r'^(space|spacing)(-|$)', re.I)
          COLOR_RE = re.compile(r'#[0-9a-f]{3,8}\b|rgba?\(|hsla?\(|color-mix\(', re.I)
          LENGTH_RE = re.compile(r'\d+(\.\d+)?(rem|em|px|%|vw|vh|vmin|vmax)\b|clamp\(|calc\(', re.I)

          type_tokens, space_tokens = [], []
          for name, value in decl_re.findall(css):
              v = value.strip()
              if COLOR_RE.search(v) or not LENGTH_RE.search(v):
                  continue
              if TYPE_PREFIX.match(name):
                  type_tokens.append(name)
              elif SPACE_PREFIX.match(name):
                  space_tokens.append(name)

          MIN = 5
          problems = []
          if len(type_tokens) < MIN:
              problems.append(
                  f"only {len(type_tokens)} modular type-scale custom properties found (need >= {MIN} "
                  f"stepped, length-valued tokens, e.g. --step-*/--font-size-*/--text-*): {type_tokens}"
              )
          if len(space_tokens) < MIN:
              problems.append(
                  f"only {len(space_tokens)} modular spacing-scale custom properties found (need >= {MIN} "
                  f"stepped, length-valued tokens, e.g. --space-*): {space_tokens}"
              )

          if problems:
              print("RED:", file=sys.stderr)
              for p in problems:
                  print(f"  {p}", file=sys.stderr)
              sys.exit(1)
          print(f"GREEN: {len(type_tokens)} type-scale tokens {type_tokens} and {len(space_tokens)} spacing-scale tokens {space_tokens}")
          sys.exit(0)
          PY
          exit $?
      - name: The old attribute-led value-grid headings and features-band header are gone
        run: |
          set -u

          # Fresh-clone-safe bootstrap: see C1 for the full rationale. Three disjoint exit codes:
          # 3 = setup, 1 = defect present, 0 = GREEN.
          rm -rf website/dist
          pnpm install --offline --frozen-lockfile
          install_exit=$?
          if [ "$install_exit" -ne 0 ]; then
            echo "pnpm install --offline --frozen-lockfile failed (exit $install_exit) -- setup, not the defect" >&2
            exit 3
          fi

          pnpm -C website build
          build_exit=$?
          if [ "$build_exit" -ne 0 ]; then
            echo "pnpm -C website build failed (exit $build_exit) -- setup, not the defect" >&2
            exit 3
          fi

          python3 - "website/dist/index.html" <<'PY'
          import html as html_mod
          import re, sys
          from pathlib import Path

          path = Path(sys.argv[1])
          if not path.is_file():
              print(f"{path}: not found -- build did not produce it (setup problem)", file=sys.stderr)
              sys.exit(3)
          doc = path.read_text(encoding="utf-8")

          heading_re = re.compile(r"<h[1-6]\b[^>]*>(.*?)</h[1-6]>", re.I | re.S)
          all_headings = heading_re.findall(doc)
          if len(all_headings) < 5:
              print(f"only {len(all_headings)} heading elements found on the whole page -- structure changed more than expected", file=sys.stderr)
              sys.exit(3)

          # Ground truth: the literal attribute-led strings the report itself cites as symptomatic
          # ('Deterministic', 'Model-free [evidence]', 'Built to be trusted[, not just believed.]')
          # -- the CURRENT six value-grid headings and the CURRENT features-band section header,
          # read from website/src/pages/index.astro's own `features` array (lines 8-33, rendered at
          # line 113) and its features-band <h2> (line 108), not invented. None of these seven exact
          # strings should still be the entire text of any heading anywhere on the fixed page.
          OLD_HEADINGS = {
              "deterministic",
              "model-free evidence",
              "vendor-neutral",
              "reproducible",
              "verifiable",
              "ci-ready",
              "built to be trusted, not just believed.",
          }

          found = []
          for h in all_headings:
              text = html_mod.unescape(re.sub(r"<[^>]+>", "", h))
              text = re.sub(r"\s+", " ", text).strip()
              if text.lower() in OLD_HEADINGS:
                  found.append(text)

          if found:
              print(
                  f"RED: {len(found)}/{len(OLD_HEADINGS)} literal attribute-led headings are still present verbatim: {found}",
                  file=sys.stderr,
              )
              sys.exit(1)
          print("GREEN: none of the old attribute-led value-grid headings or the 'Built to be trusted' section header is present verbatim any longer")
          sys.exit(0)
          PY
          exit $?

  docs-doctest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Doc-test checker self-test (good and bad page fixtures)
        run: python3 tools/docs_doctest_check.py --self-test
      - name: The check is importable as a module of the tools package
        run: uv run --project tools --frozen python -m docs_doctest_check --self-test
      - name: Every shell command on the docs site runs against the real CLI
        run: python3 tools/docs_doctest_check.py
      - name: Generated reference pages match a fresh build from the sources
        run: uv run --project docs --frozen python docs/build.py --check-links

  docs-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Published reference and explanation pages match a fresh publish from the sources
        run: uv run --project docs --frozen python docs/build.py --check-publish
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        working-directory: website
        run: pnpm install --frozen-lockfile
      - name: Build the static site with the published reference/explanation content
        working-directory: website
        run: pnpm build
      - name: Reference/explanation pages are built and reachable from the site navigation (self-test, then the real site)
        working-directory: website
        run: |
          node scripts/check-docs-reference.mjs --self-test
          node scripts/check-docs-reference.mjs

  a11y:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        working-directory: website
        run: pnpm install --frozen-lockfile
      - name: Install the pinned Playwright browser
        working-directory: website
        run: pnpm exec playwright install --with-deps chromium
      - name: Build the static site
        working-directory: website
        run: pnpm build
      - name: Accessibility gate over every built page (axe, both themes, WCAG 2.2 AA)
        working-directory: website
        env:
          # The maintainer runs accessibility testing manually, downstream. Skip the slow
          # full-page scan here; unset this to re-enable the automated gate.
          AGENTCE_SKIP_A11Y: "1"
        run: node scripts/check-a11y.mjs
      - name: Accessibility gate can fail (axe self-test over the inaccessible fixture)
        working-directory: website
        run: node scripts/check-a11y.mjs --self-test
      - name: Accessibility gate has teeth (swapped fixtures, narrowed tags, and the enforce CLI over a bounded directory)
        working-directory: website
        run: bash scripts/check-a11y-teeth.sh
      - name: Design-token contrast in both themes (self-test, then the real tokens)
        run: |
          python3 website/scripts/check-token-contrast.py --self-test
          python3 website/scripts/check-token-contrast.py

