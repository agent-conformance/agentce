# Per-package quality gate: lint, type-check, test, and coverage for every engine, on every push and
# pull request. This is the gate AGENTS.md promises; it enforces the invariant by running the real
# commands, not by building placeholder packages. Every action is pinned by commit SHA.
name: tests

on:
  push:
    branches: [main, "phase/**"]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: python
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Sync the reference engine (frozen lockfile)
        working-directory: engines/python
        run: uv sync --frozen
      - name: Lint
        working-directory: engines/python
        run: |
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
      - name: Type-check
        working-directory: engines/python
        run: uv run --frozen mypy .
      - name: Test with a coverage floor
        working-directory: engines/python
        run: uv run --frozen pytest -q -p no:cacheprovider --cov=agentce --cov-fail-under=90

  typescript:
    name: typescript
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install the TypeScript engine (frozen lockfile)
        working-directory: engines/typescript
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Lint
        working-directory: engines/typescript
        run: pnpm lint
      - name: Type-check
        working-directory: engines/typescript
        run: pnpm typecheck
      - name: Test with a coverage floor
        working-directory: engines/typescript
        run: pnpm test:cov

  java:
    name: java
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Check the Java engine (build, test, JaCoCo coverage floor)
        working-directory: engines/java
        run: ./gradlew check --no-daemon --console=plain
