# Dependency review on pull requests: fails the PR if a dependency change introduces a known
# vulnerability or a disallowed license. Runs only on pull_request (the action compares base vs head).
name: dependency-review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Dependency review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          fail-on-severity: high
          # examples/crewai/uv.lock: crewai's chromadb dependency has no release outside these
          # advisories' vulnerable range (docs/adr/0018-crewai-chromadb-advisory-exception.md).
          # Global by GHSA ID, not by path -- re-check this list against examples/*/uv.lock whenever
          # a framework example's lockfile changes.
          allow-ghsas: "GHSA-f4j7-r4q5-qw2c, GHSA-36p7-vc44-83pf, GHSA-2wm9-hf6c-p5cr, GHSA-xph7-9rjv-w5fr"
