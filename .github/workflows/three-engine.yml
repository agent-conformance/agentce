# Three-engine byte-identity (SPEC 11.5, check P5.1): the Python, TypeScript, and Java engines must
# produce a per-project canonical set over the full corpus that is byte-identical -- assertions.json and
# every packs/*/pack.json byte for byte, oscal-ar.json and results.sarif once each engine's own name and
# version are neutralised -- and each must claim full. The TypeScript and Java quickstart pages must
# prescribe only commands those engines run (`conformance run`).
# A second job scores the shared numeric and temporal edge vectors in all three engines: the canonical
# number-token decisions and the exact literal ordering the structural evaluator relies on.
# Every action is pinned by commit SHA (AGENTS.md quality gates).
name: three-engine

on:
  push:
    branches: [main, "phase/**"]
  pull_request:

permissions:
  contents: read

jobs:
  compare:
    name: three-engine ECS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install the TypeScript engine's dependencies
        working-directory: engines/typescript
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm build

      - name: Compare the three engines over the full corpus
        working-directory: conformance
        run: |
          uv run python ecs.py --engines python,typescript,java --corpus ../corpus --compare

      - name: Canonical-set comparator (self-test)
        working-directory: conformance
        run: uv run --frozen pytest -q -p no:cacheprovider tests/test_ecs_canonical_set.py

      - name: Two-engine byte-identity over the full corpus
        working-directory: conformance
        run: uv run --frozen pytest -q -p no:cacheprovider tests/test_ecs.py

      - name: Engine quickstart-page check (self-test)
        working-directory: conformance
        run: uv run --frozen pytest -q -p no:cacheprovider tests/test_engine_docs_check.py

      - name: Each engine's quickstart page prescribes only commands that engine runs
        working-directory: conformance
        run: uv run --frozen python engine_docs_check.py --engines typescript,java

  numeric-temporal-edge-vectors:
    name: numeric and temporal edge vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install the TypeScript engine's dependencies
        working-directory: engines/typescript
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      # The shared number-token and literal-ordering vectors under spec/rules/numerics-vectors/cases:
      # every engine must reproduce each expected result, and the three must agree with one another.
      - name: Score the shared edge vectors in all three engines
        working-directory: conformance
        run: uv run --frozen python numerics.py --engines python,typescript,java

      - name: Numerics gate (self-test)
        working-directory: conformance
        run: uv run --frozen pytest -q -p no:cacheprovider tests/test_numerics.py
