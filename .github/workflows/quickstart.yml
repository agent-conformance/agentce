# Fresh-machine proof (SPEC §13.4 AX-1, §14.4): on a clean runner with only the language toolchain,
# each engine runs end to end within five minutes — the Python engine assesses the vendored quickstart
# project; the TypeScript and Java engines, which implement `conformance run`, run the conformance suite
# and must write one assertions.json per project — and the engine container image builds and runs the quickstart with no network. Runs on every
# push to main or a phase branch and on every pull request, and can still be dispatched by hand; every
# action is pinned by commit SHA (AGENTS.md quality gates). No image is pushed. The
# installed-artifacts-offline job builds the wheel, sdist, npm tarball and runnable jar from the current
# sources, installs each outside the checkout and runs it from an empty directory with the network cut.
name: quickstart

on:
  push:
    branches: [main, "phase/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: quickstart (python)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Quickstart on a clean machine
        working-directory: engines/python
        run: uv run agentce quickstart --out "$RUNNER_TEMP/report"

  typescript:
    name: quickstart (typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Build the TypeScript engine
        working-directory: engines/typescript
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm build
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run the conformance suite
        run: |
          node engines/typescript/bin/agentce.js conformance run \
            --engine engines/typescript \
            --corpus corpus \
            --out "$RUNNER_TEMP/report"
      - name: Assert one assertions.json per project was written
        run: |
          python3 - "$RUNNER_TEMP/report" <<'PY'
          import json, pathlib, sys
          out = pathlib.Path(sys.argv[1])
          total = json.loads((out / "implementation-report.json").read_text())["projects"]["total"]
          found = [p for p in (out / "projects").rglob("assertions.json") if p.stat().st_size > 0]
          if total <= 0 or len(found) != total:
              sys.exit(f"expected {total} non-empty assertions.json files, found {len(found)}")
          PY
      - name: The assess smoke check itself must be able to fail
        run: python3 tools/assess_smoke_check.py --self-test
      - name: Assess the vendored quickstart project
        run: |
          node engines/typescript/bin/agentce.js assess \
            --bundle corpus/quickstart/evidence \
            --profile corpus/quickstart/applicability.yaml \
            --domain corpus/quickstart/domain.linkml.yaml \
            --catalog-dir spec/catalogs/base/eu-ai-act \
            --out "$RUNNER_TEMP/assess" --json > "$RUNNER_TEMP/assess.json"
      - name: Assert the assess run produced a real report
        run: python3 tools/assess_smoke_check.py "$RUNNER_TEMP/assess" "$RUNNER_TEMP/assess.json"

  java:
    name: quickstart (java)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build the Java engine
        working-directory: engines/java
        run: ./gradlew --no-daemon --quiet installDist
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run the conformance suite
        run: |
          engines/java/build/install/agentce/bin/agentce conformance run \
            --engine engines/java \
            --corpus corpus \
            --out "$RUNNER_TEMP/report"
      - name: Assert one assertions.json per project was written
        run: |
          python3 - "$RUNNER_TEMP/report" <<'PY'
          import json, pathlib, sys
          out = pathlib.Path(sys.argv[1])
          total = json.loads((out / "implementation-report.json").read_text())["projects"]["total"]
          found = [p for p in (out / "projects").rglob("assertions.json") if p.stat().st_size > 0]
          if total <= 0 or len(found) != total:
              sys.exit(f"expected {total} non-empty assertions.json files, found {len(found)}")
          PY
      - name: The assess smoke check itself must be able to fail
        run: python3 tools/assess_smoke_check.py --self-test
      - name: Assess the vendored quickstart project
        run: |
          engines/java/build/install/agentce/bin/agentce assess \
            --bundle corpus/quickstart/evidence \
            --profile corpus/quickstart/applicability.yaml \
            --domain corpus/quickstart/domain.linkml.yaml \
            --catalog-dir spec/catalogs/base/eu-ai-act \
            --out "$RUNNER_TEMP/assess" --json > "$RUNNER_TEMP/assess.json"
      - name: Assert the assess run produced a real report
        run: python3 tools/assess_smoke_check.py "$RUNNER_TEMP/assess" "$RUNNER_TEMP/assess.json"

  image:
    name: container image build and offline run (no push)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build the engine image without pushing
        run: docker build -f engines/python/Dockerfile -t agentce/agentce:dev .
      - name: Run the quickstart in the image with no network, as the caller's own user id
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/report"
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            -v "$RUNNER_TEMP/report:/out" agentce/agentce:dev quickstart --out /out
          test -s "$RUNNER_TEMP/report/assertions.json" || {
            echo "::error::the image's quickstart wrote no assertions.json" >&2; ls -R "$RUNNER_TEMP/report" >&2; exit 1; }
      - name: Run the image's default command with no network, as its own user
        run: docker run --rm --network none agentce/agentce:dev
      - name: The image holds the installed package, not the repository
        run: |
          set -e
          docker run --rm --entrypoint python agentce/agentce:dev -c \
            "import agentce, pathlib; p = pathlib.Path(agentce.__file__).resolve(); assert 'site-packages' in p.parts, p"
          docker run --rm --entrypoint sh agentce/agentce:dev -c \
            'test -z "$(ls -A /work)" && test -z "$(find /src /app /agentce /home /opt /srv /tmp /work -maxdepth 3 \( -name .git -o -name engines -o -name "SPEC[S]" \) 2>/dev/null)"' \
            || { echo "::error::the image holds repository files" >&2; exit 1; }

  installed-artifacts-offline:
    name: installed artifacts run offline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Prepare the Python toolchain (online, before any artifact runs)
        run: uv sync --frozen --project engines/python
      - name: Prepare the TypeScript toolchain (online, before any artifact runs)
        working-directory: engines/typescript
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: The check itself must be able to fail
        run: python3 tools/installed_artifacts_check.py --self-test
      - name: Build each artifact, install it outside the checkout, run it with no network
        run: python3 tools/installed_artifacts_check.py all --require-netns
