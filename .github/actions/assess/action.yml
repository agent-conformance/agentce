name: agentce-assess
description: >-
  Assess an evidence bundle against a signed AgentCE catalog, gate the build on the result, upload
  results.sarif to code scanning, and write a job summary. Offline: no network call is made by the
  assessment itself, only by this action's own setup steps.
inputs:
  bundle:
    description: the evidence bundle directory, relative to the calling repository's root
    required: true
  profile:
    description: the applicability profile file, relative to the calling repository's root
    required: true
  domain:
    description: the domain ontology binding file, relative to the calling repository's root
    required: true
  catalog:
    description: "catalog ids, comma-separated: <id@ver>[,<id@ver>...] (default: the profile's catalogs)"
    required: false
    default: ""
  fail-on:
    description: >-
      a --fail-on expression scoping which assertions fail the build (default: fail on any
      non-conformant assertion)
    required: false
    default: ""
  out:
    description: the output directory for assertions.json, results.sarif, report.md, and the rest
    required: false
    default: "./out"
outputs:
  out:
    description: the output directory that was written
    value: ${{ inputs.out }}
runs:
  using: composite
  steps:
    - name: Install uv
      shell: bash
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Locate the AgentCE reference engine
      shell: bash
      run: |
        engine_dir="$(cd "${{ github.action_path }}/../../.." && pwd)/engines/python"
        echo "AGENTCE_ENGINE_DIR=$engine_dir" >> "$GITHUB_ENV"

    - name: Run agentce assess
      shell: bash
      env:
        # Bound to env vars, never interpolated directly into the script: an expression or path
        # containing shell metacharacters must not reach the runner's shell, only agentce's own
        # --fail-on parser (which rejects anything outside its tiny grammar; SPEC §7).
        AGENTCE_BUNDLE: ${{ inputs.bundle }}
        AGENTCE_PROFILE: ${{ inputs.profile }}
        AGENTCE_DOMAIN: ${{ inputs.domain }}
        AGENTCE_CATALOG: ${{ inputs.catalog }}
        AGENTCE_FAIL_ON: ${{ inputs.fail-on }}
        AGENTCE_OUT: ${{ inputs.out }}
      run: |
        set -e
        set -- --bundle "$AGENTCE_BUNDLE" --profile "$AGENTCE_PROFILE" --domain "$AGENTCE_DOMAIN" --out "$AGENTCE_OUT"
        if [ -n "$AGENTCE_CATALOG" ]; then set -- "$@" --catalog "$AGENTCE_CATALOG"; fi
        if [ -n "$AGENTCE_FAIL_ON" ]; then set -- "$@" --fail-on "$AGENTCE_FAIL_ON"; fi
        # agentce assess writes its job summary to $GITHUB_STEP_SUMMARY automatically (SPEC §9);
        # no separate summary step is needed. A multi-clause expression (spaces and all) survives as
        # one argument because it is carried through a quoted env var and "$@", never word-split.
        uv run --project "$AGENTCE_ENGINE_DIR" --frozen agentce assess "$@"

    - name: Upload results.sarif to code scanning
      # Runs even when the step above exits non-zero (that is the gate firing on a real finding) --
      # the whole point of code-scanning upload is to annotate the non-conformant run, not only the
      # clean ones.
      if: always()
      uses: github/codeql-action/upload-sarif@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3
      with:
        sarif_file: ${{ inputs.out }}/results.sarif
