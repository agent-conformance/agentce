name: setup-verification-env
description: >-
  Install uv, Node 22, Java 21, the website's pnpm dependencies and every adapter's own uv-managed
  virtualenv -- the toolchain every job in verification.yml needs before it can run a gate or a
  gate's seeded-fault demo. Shared by the `build` and `demo-fault` jobs so both stay in sync.
runs:
  using: composite
  steps:
    - name: Install uv
      shell: bash
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: "22"
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
      with:
        distribution: temurin
        java-version: "21"
    - name: Install the website's dependencies
      shell: bash
      working-directory: website
      run: |
        corepack enable
        pnpm install --frozen-lockfile
    - name: Sync the projects the gates run in
      shell: bash
      run: |
        for project in adapters/*/; do
          if [ -f "$project/uv.lock" ]; then (cd "$project" && uv sync --frozen); fi
        done
