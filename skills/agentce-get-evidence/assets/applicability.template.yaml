# Applicability profile template (SPEC §6.5). Fill in the bracketed values, then run
# `lint_profile --profile agentce/applicability.yaml` until clean. This template is a lint-clean
# starting point; replace the example subject with your deployment's.
profile_version: 1
observation_window:
  start: "2026-05-01T00:00:00Z"   # ≥ 90 days, or set pilot_window: true below
  end: "2026-08-29T00:00:00Z"
# pilot_window: true              # uncomment for a shorter pilot window
content_capture:
  mode: hashes_only               # hashes_only | none | allowed (per the content-capture policy)
catalogs:
  - "eu-ai-act@2026.09"
subjects:
  - id: "spiffe://corp/agents/<your-agent>"
    name: "<human-readable name>"
    role: "both"                  # deployer | provider | both
    annex_iii_category: "5:access-to-essential-services"   # or not_annex_iii
    classification_status: draft_for_legal_review          # a named reviewer confirms (S-8)
    declared_decision_types:
      - "dom:<YourDecision>"
    declared_oversight:
      "dom:<YourDecision>": "review_before"
    confirmations:                # confirmed_by a named person (S-8)
      classification: {confirmed_by: "<reviewer@org>"}
      decision_typing: {confirmed_by: "<reviewer@org>"}
      oversight: {confirmed_by: "<reviewer@org>"}
    evidence_sources:
      - adapter: "otel-genai"
        source: "urn:agentce:source:<runtime>:<env>"
        class: "self_report"
        class_justification: "emitted by the agent runtime; self-reported."
      - adapter: "mcp-gateway"
        source: "urn:agentce:source:<gateway>:<env>"
        class: "enforcement_point"
        class_justification: "the gateway sits on the only tool-call egress path."
        manifest: "reference/gateway-counts.json"   # or manifest_reason: "<why none>"
