[project]
name = "agentce-check-report-skill"
version = "0.0.1"
description = "AgentCE check-report skill (SPEC 13.3.4): pre-run, manual-record, and readiness scripts around a report."
requires-python = ">=3.12"
dependencies = [
  "agent-conformance",
  "pyyaml>=6,<7",
]

# The scripts run in place (python scripts/<name>.py); uv manages only the environment. A skill is
# never in the evaluation path (SPEC 13.3.1); its scripts are deterministic, offline, and model-free.
[tool.uv]
package = false

[tool.uv.sources]
agent-conformance = { path = "vendor/agent_conformance-0.1.0-py3-none-any.whl" }

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "mypy>=1.11,<2",
  "ruff>=0.6,<0.13",
  "types-pyyaml>=6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
addopts = "-p no:cacheprovider"
