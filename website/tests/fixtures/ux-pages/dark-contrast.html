<!doctype html>
<!-- check-ux-pages.mjs --self-test: readable in light, low contrast in dark; axe at phone width must
     report color-contrast in the dark theme only. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dark contrast</title>
    <style>
      body { margin: 0; padding: 16px; font-family: sans-serif; color: #0f172a; background: #ffffff; }
      [data-theme='dark'] body { color: #334155; background: #0f172a; }
    </style>
  </head>
  <body>
    <main>
      <h1>Dark contrast</h1>
      <p>This text is hard to read in the dark theme.</p>
    </main>
  </body>
</html>
