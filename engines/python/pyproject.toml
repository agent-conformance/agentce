[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agent-conformance"
version = "0.0.1"
description = "Agent Conformance Engine (AgentCE) - a deterministic, model-free engine that evaluates AI-agent evidence against executable control catalogs and emits a conformance report."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Agent Conformance Engine maintainers" }]
dependencies = [
  "jsonschema>=4.21,<5",
]
keywords = ["ai-agents", "conformance", "eu-ai-act", "oscal", "provenance", "shacl", "opentelemetry"]
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://agent-conformance.org"
Repository = "https://github.com/agent-conformance/agentce"
Specification = "https://github.com/agent-conformance/agentce"

[project.scripts]
agentce = "agentce.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["agentce"]

[tool.hatch.build.targets.wheel.force-include]
"agentce/data/no-ml-denylist.txt" = "agentce/data/no-ml-denylist.txt"
"agentce/data/agentce-evidence.schema.json" = "agentce/data/agentce-evidence.schema.json"

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "mypy>=1.11,<2",
  "ruff>=0.6,<0.13",
  "hypothesis>=6,<7",
  "types-jsonschema>=4.21",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.coverage.run]
branch = true
source = ["agentce"]

[tool.mypy]
python_version = "3.12"

