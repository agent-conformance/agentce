id: TRN-03
version: "2026.09"
title: Affected persons informed and explanation reconstructable
description: >
  Affected persons are notified of a consequential decision and the record reconstructs the main
  elements of the determination from graph facts (AI RMF MEASURE 2.8 transparency and accountability).
crosswalk:
  - {framework: nist-ai-rmf, clause: "MEASURE 2.8", relation: implements, verified_against_text: false}
applicability:
  applies_to_roles: [both]
evaluation:
  mode: semi-automated
  rung: 2
  min_source_class: self_report
  minimum_evidence:
    - {event: Decision, class: self_report}
    - {event: Notice, class: any}
  shape: shapes/TRN-03.ttl
expectations:
  - {id: S1, text: "Affected persons informed and explanation reconstructable."}
severity: medium
evidence_strength: strong
tolerance: {kind: count, max: 0}
tolerance_rationale: "TRN-03 is a structural expectation with no tolerated exceptions."
false_positive_modes:
  - "A condition declared as an accepted deviation in the applicability profile."
test_cases:
  - {id: pass, expected: passed, fixture: test/TRN-03/passed.jsonl}
  - {id: fail, expected: failed, fixture: test/TRN-03/failed.jsonl}
  - {id: na, expected: inapplicable, fixture: test/TRN-03/inapplicable.jsonl}
