id: INC-02
version: "2026.09"
title: Serious incidents are recorded with an accountable actor (by role)
description: >
  Every recorded Incident names the accountable actor, evaluated for the deployer and the provider
  roles. The role-specific serious-incident clocks of Art. 26(5) and 73 are added in a later phase.
crosswalk:
  - {framework: eu-ai-act, clause: "Art. 73", relation: implements, verified_against_text: false}
  - {framework: eu-ai-act, clause: "Art. 26(5)", relation: supports, verified_against_text: false}
applicability:
  applies_to_roles: [deployer, provider]
evaluation:
  mode: automated
  rung: 2
  min_source_class: independent_system
  minimum_evidence:
    - {event: Incident, class: any}
  shape: shapes/INC-02.ttl
expectations:
  - {id: N1, text: "The incident record names the accountable actor."}
severity: high
evidence_strength: strong
tolerance: {kind: count, max: 0}
false_positive_modes:
  - "An incident under investigation before the accountable actor is assigned."
test_cases:
  - {id: pass, expected: passed, fixture: test/INC-02/passed.jsonl}
  - {id: fail, expected: failed, fixture: test/INC-02/failed.jsonl}
  - {id: na, expected: inapplicable, fixture: test/INC-02/inapplicable.jsonl}
