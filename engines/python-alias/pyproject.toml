[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agentce"
version = "0.1.0"
description = "Alias package: depends on agent-conformance (the Agent Conformance Engine), so the agentce name resolves to the same engine."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Agent Conformance Engine maintainers" }]
dependencies = ["agent-conformance==0.1.0"]
classifiers = ["Development Status :: 3 - Alpha"]

[project.urls]
Homepage = "https://agent-conformance.org"
Repository = "https://github.com/agent-conformance/agentce"

[tool.hatch.build.targets.wheel]
packages = ["agentce_alias"]
