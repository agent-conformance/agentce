# Worked control from SPEC 7.1, used to check control.schema.json. The version is quoted so it loads
# as the string the schema expects rather than a YAML float.
id: OVS-03
version: "2026.09"
title: Consequential actions carry human-terminated, policy-authorised authority
description: >
  Every action executing a consequential decision must be authorised by a policy
  decision from an enforcement point and attributable through an unbroken delegation
  chain to a human principal, with the declared oversight modality on record.
crosswalk:
  - {framework: eu-ai-act, clause: "Art. 14(1)-(3)", relation: implements}
  - {framework: eu-ai-act, clause: "Art. 26(2)", relation: supports}
  - {framework: iso-42001, clause: "A.9.3", relation: maps}
  - {framework: owasp-asi-2026, clause: "ASI03", relation: mitigates}
interpretations: [IR-02, IR-03, IR-05]
applicability:
  applies_to_roles: [deployer, provider]
  when: "decision_type subClassOf agentce:ConsequentialDecision"
evaluation:
  mode: automated
  rung: 2
  min_source_class: enforcement_point
  minimum_evidence:
    - {event: ToolCall, class: enforcement_point}
    - {event: PolicyDecision, class: enforcement_point}
    - {event: DelegationIssued, class: any}
  shape: shapes/OVS-03.ttl
expectations:
  - id: E1
    text: The executing ToolCall has agentce:authorizedBy to a PolicyDecision with decision=allow or require_approval satisfied.
  - id: E2
    text: The delegation chain terminates at a HumanPrincipal and agentce:chainVerified is true.
  - id: E3
    text: The Decision carries an oversight_modality equal to the declared modality for its type.
severity: high
evidence_strength: strong
tolerance: {kind: count, max: 0}
tolerance_rationale: "A single unauthorised consequential action is a control failure."
false_positive_modes:
  - "Break-glass actions authorised under an emergency policy (must be declared in profile as exempt policy ids)."
techniques: [techniques/OVS-03/*.md]
test_cases:
  - {id: pass-01, expected: passed, fixture: corpus/fixtures/OVS-03/pass-01.jsonl}
  - {id: fail-missing-authz, expected: failed, fixture: corpus/fixtures/OVS-03/fail-01.jsonl}
  - {id: fail-spliced-chain, expected: failed, fixture: corpus/fixtures/OVS-03/fail-02.jsonl}
  - {id: inapplicable-nonconsequential, expected: inapplicable, fixture: corpus/fixtures/OVS-03/na-01.jsonl}
  - {id: insufficient-selfreport-only, expected: insufficient_evidence, fixture: corpus/fixtures/OVS-03/ie-01.jsonl}
remediation_hint: "Route the executing tool through an enforcement point that emits PolicyDecision; propagate RFC 8693 delegation tokens; declare oversight modality in policy for the decision type."
