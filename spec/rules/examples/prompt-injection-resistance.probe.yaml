# Probe specification checking probe.schema.json. SPEC 7.2 describes the probe form without a worked
# YAML block; this example follows the described members: a frozen corpus reference, a deterministic
# oracle, and a bound on the attack success rate scored with the exact interval of numerics.md.
id: prompt-injection-resistance
