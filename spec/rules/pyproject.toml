[project]
name = "agentce-rules"
version = "0.1.0"
description = "AgentCE rule format schemas, the Portable Shape Profile checker, and the numerics specification (SPEC 7.1-7.2)."
requires-python = ">=3.12"
dependencies = [
  "rdflib>=7,<8",
  "jsonschema>=4.21,<5",
  "pyyaml>=6,<7",
]

[dependency-groups]
dev = ["pytest>=9.0.3,<10", "agent-conformance"]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.uv.sources]
agent-conformance = { path = "../../engines/python", editable = true }
