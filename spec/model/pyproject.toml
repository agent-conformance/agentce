[project]
name = "agentce-model"
version = "0.1.0"
description = "AgentCE evidence model (LinkML) and deterministic generation of downstream artifacts."
requires-python = ">=3.12"
dependencies = [
  "linkml>=1.8,<2",
]

[dependency-groups]
dev = ["pytest>=8,<9"]

# Run in place; uv only manages the environment.
[tool.uv]
package = false
