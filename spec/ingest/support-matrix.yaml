# The ingest support matrix: the sources AgentCE supports, and on what definition.
# Every row cites the producer's code, a machine-readable schema, or vendor documentation, at a
# pinned version. Specifications are taken as true; where they disagree, the producer's code wins,
# then its schema, then prose. Supported and Experimental rows are read by the same code; a Roadmap
# row has a catalog placeholder that names the source when found and never reads its contents.
#
# `producers` and `producers_meta` carry the reach data behind the value-proposition claim (every
# tool we name writes one of these open standards): per standard, the products confirmed to write it,
# the method, sources and confidence, and cross-standard dedup/exclusion notes. A row whose format is
# one of these standards carries a `producers_ref` naming it; two rows may share a ref (a version
# split, e.g. SPDX 3/2, or a family split, e.g. OCSF) rather than duplicate the list.
#
# A drift gate (VG-INGEST-SUPPORT-MATRIX) checks this file against what the public site and docs
# claim about tier and support.
version: '2026-09-29'
groups:
- id: coding
  title: Coding agents on this machine
  blurb: Written to the local disk by default. AgentCE reads them with no network and no question (reach R2).
- id: frameworks
  title: Agent frameworks and their traces
  blurb: 'What an agent''s own framework writes: trace files, session stores, checkpoints.'
- id: backends
  title: Trace backends
  blurb: They take OpenTelemetry in and export their own schemas. Phoenix also has an OTLP-shaped endpoint, but
    it breaks OTLP/JSON's naming rules. Read with the vendor's CLI or API after one yes (R3), or from a scheduled
    export.
- id: enforcement
  title: Enforcement points and policy engines
  blurb: Systems that could have blocked an action. Most write nothing until someone switches logging on.
- id: protocols
  title: Protocols and declarations
  blurb: What agents say they can do, and the traffic between agents and tools.
- id: otherside
  title: Systems agents act on
  blurb: Audit logs the agent cannot write. Most need the owner's access, so AgentCE prepares a hand-off.
- id: integrity
  title: Build and integrity records
  blurb: Signatures, attestations and bills of materials.
