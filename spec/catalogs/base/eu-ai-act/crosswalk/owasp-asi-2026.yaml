# OWASP Top 10 for Agentic Applications 2026 (ASI01-ASI10, published by the OWASP GenAI Security
# Project's Agentic Security Initiative, 9 Dec 2025): the agentic threat classes whose detection or
# traceability AgentCE's runtime evidence supports, mapped to AgentCE schema elements, correctness-
# ladder rungs, and base-catalog control ids.
#
# 18.16a (2026-10): replaces this file's prior T1-T13 scheme, drawn from a different, older "Agentic
# AI -- Threats and Mitigations" taxonomy, with the official ASI01-ASI10 ids and titles. The official
# primary source (the OWASP Top 10 for Agentic Applications 2026 PDF, genai.owasp.org, 9 Dec 2025) is
# downloadable and text-extractable (confirmed this item via pypdf, after an earlier round wrongly
# concluded it exposed no machine-readable text); its own Appendix A, "OWASP Agentic AI Security
# Mapping Matrix," cross-maps each ASI category to the T1-T17 ids from the older "Agentic AI Threats &
# Mitigations" document (see evidence/P18-18.16a/python-reference.md for the fetch command and the
# extracted table). Every T-id this file's five citing controls used is re-matched against that
# official table, not against AgentCE's own guess at a conceptual fit:
#   T1 -> ASI06; T2 -> ASI02; T3 -> ASI03; T6 -> ASI01 (also ASI06); T7 -> ASI01, ASI09;
#   T8 -> ASI08, ASI09; T10 -> ASI09; T11 -> ASI05 (also ASI04); T13 -> ASI10 (also ASI04).
# T9 (identity spoofing/impersonation, from the older document) has no row in Appendix A at all; its
# move to ASI07 is AgentCE's own judgment call (ASI07's own description covers spoofed peer agents),
# disclosed as such rather than claimed as an official mapping.
#
# Threat identifiers only; no source text is reproduced. The `obligation` field is AgentCE's own
# statement of what its evidence makes detectable or reconstructable for that threat class -- AgentCE
# is an assessment engine, not a runtime guard, so it evidences that the events needed to detect or
# trace a threat are present and typed, not that the threat is prevented. Every reference carries
# `verified_against_text: false` until a reviewer confirms the mapping against the source (SPEC 7.3).
framework: owasp-asi-2026
title: "OWASP Top 10 for Agentic Applications 2026 (ASI01-ASI10)"
version: "2025.12"
source:
  publisher: OWASP
  identifier: "OWASP GenAI Security Project, Agentic Security Initiative -- OWASP Top 10 for Agentic Applications 2026"
obligations:
  - ref: "ASI01"
    obligation: Agent goal hijack is reconstructable -- the operative determination behind each consequential decision is recoverable from typed graph facts, so a reviewer can tell the agent's declared objective from one substituted afterward.
    schema_elements: [Instruction, Decision, Outcome]
    rungs: [2, 4]
    controls: [REC-04]
    verified_against_text: false
  - ref: "ASI02"
    obligation: Tool misuse is traceable -- each tool call is attributed and gated by an authorization check whose decision is recorded.
    schema_elements: [ToolCall, AuthzCheck, PolicyDecision]
    rungs: [2]
    controls: []
    verified_against_text: false
  - ref: "ASI03"
    obligation: Identity and privilege abuse is traceable -- delegations carry the granting principal and scope, with access checked against them before a consequential action proceeds.
    schema_elements: [DelegationIssued, AuthzCheck, ResourceAccess]
    rungs: [0, 1, 2]
    controls: []
    verified_against_text: false
  - ref: "ASI04"
    obligation: Agentic supply chain components are traceable -- every loaded skill, MCP server, model, prompt, config, or policy bundle is recorded with its digest and signer, and its attestation is checked before the components it contributes are trusted.
    schema_elements: [BundleLoaded, Attestation]
    rungs: [2]
    controls: []
    verified_against_text: false
  - ref: "ASI05"
    obligation: Unexpected code execution is traceable -- tool calls that reach an execution surface are attributed and gated by a recorded policy decision.
    schema_elements: [ToolCall, PolicyDecision, Refusal]
    rungs: [2]
    controls: [ROB-02]
    verified_against_text: false
  - ref: "ASI06"
    obligation: Memory and context poisoning is traceable -- consequential decisions declare their memory reads, and untrusted writes into that memory are visible in the record.
    schema_elements: [MemoryWrite, MemoryRead, Decision]
    rungs: [2, 3]
    controls: [ROB-02]
    verified_against_text: false
  - ref: "ASI07"
    obligation: Inter-agent identity spoofing and impersonation are traceable -- acting identities are attested and delegations bind an issuer to a subject, so a peer agent's claimed identity can be checked rather than assumed.
    schema_elements: [Attestation, DelegationIssued, AuthzCheck]
    rungs: [2]
    controls: []
    verified_against_text: false
  - ref: "ASI08"
    obligation: Cascading failures across agents are reconstructable and the repudiation and untraceability that let them compound are closed -- cross-agent task correlation and the derivedFrom chain let a reviewer trace how one agent's decision or outcome propagated into another's, and the acting agent behind every consequential decision is non-repudiably recorded with actor, source timestamp, and integrity results.
    schema_elements: [Decision, Outcome, Incident, Attestation, SessionStart, SessionEnd, IntegrityResult]
    rungs: [0, 1, 2, 4]
    controls: [REC-01, REC-04, INT-01]
    verified_against_text: false
  - ref: "ASI09"
    obligation: Human-agent trust exploitation is evidenced by the distribution of approval latency and decisions, exposing the rubber-stamping a persuasive, misaligned, or deceptive agent could induce.
    schema_elements: [ApprovalRequested, ApprovalDecided, Decision, Outcome]
    rungs: [2, 3]
    controls: [OVS-03]
    verified_against_text: false
  - ref: "ASI10"
    obligation: Rogue agents operating in or against a multi-agent system are traceable -- every participating agent is attested with its delegations and outcomes attributed, and a human actor's override of an agent's action is itself evidenced.
    schema_elements: [Attestation, DelegationIssued, Outcome, Decision, Override]
    rungs: [2, 3]
    controls: [INT-01]
    verified_against_text: false
