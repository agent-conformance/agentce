# EU AI Act crosswalk skeleton: the obligation traceability matrix of SPEC 6.9 mapped to AgentCE
# schema elements, correctness-ladder rungs, and (as they land in later phases) control ids.
#
# Clause references only; the standard's text is never reproduced (SPEC 7.3 crosswalk hygiene). The
# `obligation` field is AgentCE's own statement of what must be provable, not a quotation. Each row
# carries `verified_against_text: false` until a reviewer with the source confirms the clause mapping
# (SPEC 7.3, item 4.8); `controls` is filled as the base-catalog families are authored (phase 1+).
framework: eu-ai-act
version: "2026.09"
obligations:
  - ref: "Art. 12(1)-(2)"
    obligation: Automatic recording of events over the lifetime; identification of risk situations and substantial modifications; support for Art. 72 and Art. 26(5) monitoring.
    schema_elements: [SessionStart, SessionEnd, BundleLoaded, Attestation, IntegrityResult]
    rungs: [0, 1, 2]
    controls: []
    verified_against_text: false
  - ref: "Art. 12(3)"
    obligation: Biometric minimum log content -- period of use, reference database, matched input, and at least two verifying persons.
    schema_elements: [SessionStart, SessionEnd, ResourceAccess, Outcome, ApprovalDecided]
    rungs: [2]
    controls: []
    verified_against_text: false
  - ref: "Art. 13"
    obligation: Instructions for use, including oversight measures, match operation.
    schema_elements: [Decision]
    rungs: [2]
    controls: []
    verified_against_text: false
  - ref: "Art. 14(1)-(3)"
    obligation: Oversight measures identified and applied commensurately; declared modality per decision type equals observed.
    schema_elements: [Decision]
    rungs: [2]
    controls: [OVS-03]
    verified_against_text: false
  - ref: "Art. 14(4)(a)"
    obligation: Ability to monitor operation and detect anomalies or unexpected performance.
    schema_elements: [Outcome, Incident]
    rungs: [3]
    controls: []
    verified_against_text: false
  - ref: "Art. 14(4)(b)"
    obligation: Awareness of automation bias, evidenced by approval latency and override distribution.
    schema_elements: [ApprovalDecided, Override]
    rungs: [3]
    controls: []
    verified_against_text: false
  - ref: "Art. 14(4)(c)-(d)"
    obligation: Interpret output; decide not to use, disregard, override, or reverse it, with a human actor on observed overrides.
    schema_elements: [Decision, Override]
    rungs: [2, 3]
    controls: []
    verified_against_text: false
  - ref: "Art. 14(4)(e)"
    obligation: Intervene or interrupt (stop button or similar); mechanism declared and enforcement-point evidenced.
    schema_elements: [Interrupt]
    rungs: [2]
    controls: []
    verified_against_text: false
  - ref: "Art. 14(5)"
    obligation: Two-person verification for biometric identification (two distinct human principals).
    schema_elements: [ApprovalDecided]
    rungs: [2]
    controls: []
    verified_against_text: false
  - ref: "Art. 15"
    obligation: Accuracy, robustness, and cybersecurity, including poisoning and adversarial inputs; no untrusted memory used by consequential decisions.
    schema_elements: [MemoryWrite, MemoryRead, Attestation, PolicyDecision]
    rungs: [2, 3]
    controls: [ROB-02]
    verified_against_text: false
  - ref: "Art. 10"
    obligation: Data governance and bias examination in operation, by declared group and decision type.
    schema_elements: [ResourceAccess, Decision]
    rungs: [3]
    controls: []
    verified_against_text: false
  - ref: "Art. 9"
    obligation: Continuous risk management including testing; findings feed the risk register and a run-cadence check.
    schema_elements: [Incident]
    rungs: []
    process: true
    controls: []
    verified_against_text: false
  - ref: "Art. 11 / Annex IV"
    obligation: (Provider) technical documentation matches the running system; documented components and oversight measures are a subset of the observed.
    schema_elements: [BundleLoaded]
    rungs: [2]
    controls: [DOC-01]
    verified_against_text: false
  - ref: "Art. 17"
    obligation: (Provider) quality-management system including record-keeping procedures; reproducibility of findings.
    schema_elements: [Attestation]
    rungs: [1]
    controls: []
    verified_against_text: false
  - ref: "Art. 19 / 26(6)"
    obligation: Logs retained at least six months (providers Art. 19; deployers Art. 26(6)); retention window meets policy and no gap exceeds the rotation interval.
    schema_elements: [SessionStart, SessionEnd, IntegrityResult]
    rungs: [1, 2]
    controls: [REC-04]
    verified_against_text: false
  - ref: "Art. 26(2)"
    obligation: Oversight assigned to persons with competence, training, and authority for the decision type.
    schema_elements: [ApprovalDecided]
    rungs: [2]
    controls: []
    verified_against_text: false
  - ref: "Art. 26(5)"
    obligation: Monitor operation; inform provider and authority; report serious incidents with timing.
    schema_elements: [Incident, Notice]
    rungs: [2]
    controls: [INC-02]
    verified_against_text: false
  - ref: "Art. 26(11) / 86"
    obligation: Inform affected persons and provide an explanation of the AI's role and the main elements of the decision, reconstructable from graph facts.
    schema_elements: [Notice, Decision]
    rungs: [2, 4]
    controls: [TRN-03]
    verified_against_text: false
  - ref: "Art. 27 / 26(9)"
    obligation: FRIA/DPIA cover the observed decision types and data classes; observed scope is a subset of the assessed scope.
    schema_elements: [Decision]
    rungs: [2]
    controls: []
    verified_against_text: false
  - ref: "Art. 49 / 71"
    obligation: Registration exists for each high-risk (Annex III) subject.
    schema_elements: [SessionStart]
    rungs: [2]
    controls: []
    verified_against_text: false
  - ref: "Art. 50"
    obligation: Disclosure of AI interaction and marking of synthetic content, per interaction type.
    schema_elements: [Disclosure, ModelCall]
    rungs: [2]
    controls: []
    verified_against_text: false
  - ref: "Art. 72"
    obligation: (Provider) active, systematic post-market monitoring; deployers evidence Art. 26(5) monitoring instead; missed-run detection and trend artifacts.
    schema_elements: [Incident, Outcome]
    rungs: [3]
    process: true
    controls: []
    verified_against_text: false
  - ref: "Art. 73"
    obligation: Serious incidents reported within the deadlines (immediately after causal link; 15 days; 2 days widespread; 10 days death), by role.
    schema_elements: [Incident]
    rungs: [2]
    controls: [INC-02]
    verified_against_text: false
  - ref: "GDPR Art. 22 (hook)"
    obligation: Automated individual decisions with legal or significant effects have safeguards; sole AI role with significant effect requires a review path.
    schema_elements: [Decision]
    rungs: [2]
    controls: []
    verified_against_text: false
