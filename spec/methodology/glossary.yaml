# Canonical glossary of AgentCE terminology: the small set of terms the specification defines a
# precise meaning for. The published site's glossary page is generated from this file, so it cannot
# drift from the term list here: a page built from this file lists exactly these terms with exactly
# this prose.
terms:
  - term: Assertion
    definition: the engine's outcome for one control on one subject, with evidence pointers.
  - term: Bundle
    definition: "the unit of assessment: events, attestations, reference snapshots, manifest."
  - term: Chokepoint
    definition: a place in an agent architecture where every instance of an action must pass (model I/O, tool access, authorization, human decision, artifact load).
  - term: Conformance claim
    definition: the scoped statement of what was assessed, by whom, against what, with what methods.
  - term: Deviation
    definition: an accepted, time-bounded departure from a control with a compensating measure.
  - term: Enforcement point
    definition: a system that could have prevented the action and whose record does not depend on the agent.
  - term: Glue vocabulary
    definition: the small set of relations AgentCE defines because no existing vocabulary carries them.
  - term: Portable shape profile (PSP)
    definition: the SHACL Core subset all engines execute identically.
  - term: Rung
    definition: the position of an outcome on the correctness ladder (coverage, integrity, structural, statistical, semantic, legal).
  - term: Subject
    definition: the agent deployment being assessed.
