# A GitLab CI/CD component: the vendor-neutral counterpart to the GitHub composite action and reusable
# workflow. GitLab has no native SARIF ingestion and no exact analogue of $GITHUB_STEP_SUMMARY, so this
# job exposes results.sarif and report.md as downloadable, inspectable job artifacts (GitLab's own
# general mechanism) and prints the report to the job log, rather than claiming a feature GitLab does
# not provide.
spec:
  inputs:
    agentce_ref:
      description: the agent-conformance/agentce commit SHA to run assess from
    bundle:
      description: the evidence bundle directory, relative to the including project's root
    profile:
      description: the applicability profile file, relative to the including project's root
    domain:
      description: the domain ontology binding file, relative to the including project's root
    catalog:
      description: "catalog ids, comma-separated: <id@ver>[,<id@ver>...] (default: the profile's catalogs)"
      default: ""
    fail_on:
      description: a --fail-on expression scoping which assertions fail the build
      default: ""
    out:
      description: the output directory for assertions.json, results.sarif, report.md, and the rest
      default: "out"
---
agentce-assess:
  stage: test
  image: python:3.12-slim
  variables:
    GIT_STRATEGY: clone
    # Bound to CI/CD variables at the job level, never interpolated directly into a script line: a
    # value with shell metacharacters must not reach the runner's shell (same rule the GitHub
    # artifacts follow).
    AGENTCE_REF: "$[[ inputs.agentce_ref ]]"
    AGENTCE_BUNDLE: "$[[ inputs.bundle ]]"
    AGENTCE_PROFILE: "$[[ inputs.profile ]]"
    AGENTCE_DOMAIN: "$[[ inputs.domain ]]"
    AGENTCE_CATALOG: "$[[ inputs.catalog ]]"
    AGENTCE_FAIL_ON: "$[[ inputs.fail_on ]]"
    AGENTCE_OUT: "$[[ inputs.out ]]"
  before_script:
    - pip install --no-cache-dir uv
    - git clone --depth 1 --branch "$AGENTCE_REF" https://github.com/agent-conformance/agentce.git .agentce-engine || (git clone https://github.com/agent-conformance/agentce.git .agentce-engine && git -C .agentce-engine checkout "$AGENTCE_REF")
  script:
    - |
      set -- --bundle "$AGENTCE_BUNDLE" --profile "$AGENTCE_PROFILE" --domain "$AGENTCE_DOMAIN" --out "$AGENTCE_OUT"
      if [ -n "$AGENTCE_CATALOG" ]; then set -- "$@" --catalog "$AGENTCE_CATALOG"; fi
      if [ -n "$AGENTCE_FAIL_ON" ]; then set -- "$@" --fail-on "$AGENTCE_FAIL_ON"; fi
      uv run --project .agentce-engine/engines/python --frozen agentce assess "$@"
    - cat "$AGENTCE_OUT/report.md"
  artifacts:
    when: always
    paths:
      - "$AGENTCE_OUT/results.sarif"
      - "$AGENTCE_OUT/report.md"
