[project]
name = "agentce-corpus"
version = "0.0.1"
description = "AgentCE simulated corpus (SPEC 11): the deterministic generator, the single-project assess helper, and the ground-truth ECS entrypoints."
requires-python = ">=3.12"
dependencies = [
  "agent-conformance",
]

# The corpus modules run in place from this directory (python -m corpus.*); uv manages only the
# environment. The generated corpus output is never committed (SPEC 11.7).
[tool.uv]
package = false

[tool.uv.sources]
agent-conformance = { path = "../engines/python", editable = true }

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "mypy>=1.11,<2",
  "ruff>=0.6,<0.13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".."]
addopts = "-p no:cacheprovider"

[tool.mypy]
python_version = "3.12"
