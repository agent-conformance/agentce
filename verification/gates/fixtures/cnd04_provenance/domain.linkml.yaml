# Domain ontology binding for the VG-CND04-PROVENANCE gate fixture: dom:CreditDecision is consequential, and the
# credit-review task type authorises principals in the credit_officer role (SPEC §7.7.4 "for the task type", §7.7.6).
decision_types:
  - {id: "dom:CreditDecision", subclass_of: "agentce:ConsequentialDecision", consequential: true}
  - {id: "dom:Minor", subclass_of: "agentce:Decision", consequential: false}
task_scopes:
  - {task_type: "credit-review", allowed_tools: ["lookup"], allowed_effect_classes: ["read"],
     requires_approval: ["irreversible"], budgets: {tokens: 1000, compute_seconds: 60, spend: 0}, authorised_principal_roles: ["credit_officer"]}
