# Domain ontology binding for the VG-EUAIACT-CLUSTER4 gate fixture (18.37g). dom:CreditDecision is consequential, so
# a ToolCall whose refs.decision names one executes a consequential decision; dom:Lookup is not.
decision_types:
  - id: "dom:CreditDecision"
    subclass_of: "agentce:ConsequentialDecision"
    consequential: true
  - id: "dom:Lookup"
    subclass_of: "agentce:Decision"
    consequential: false
