# Domain binding for the VG-APPROVAL-OUTCOME gate fixture: dom:CreditDecision declares no oversight modality and
# dom:LargeLoanDecision declares dual_control (copied from the VG-EUAIACT-CLUSTER1 fixture).
decision_types:
  - id: "dom:CreditDecision"
    subclass_of: "agentce:ConsequentialDecision"
    consequential: true
  - id: "dom:LargeLoanDecision"
    subclass_of: "agentce:ConsequentialDecision"
    consequential: true
    required_oversight_modality: "dual_control"
# The one task type: every action is of it, so CND-04 (VG-HELD-DECISION-EVERYWHERE) reads credit_officer as the role
# authorised to instruct one (SPEC §7.7.6 authorised_principal_roles). No fixture record names a task, so no other
# control reads this scope.
task_scopes:
  - task_type: "credit-review"
    allowed_effect_classes: ["read"]
    authorised_principal_roles: ["credit_officer"]
