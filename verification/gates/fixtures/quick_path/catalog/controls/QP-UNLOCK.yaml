id: QP-UNLOCK
version: "2026.09"
title: Gate fixture control requiring a self-reported tool call and model call
description: >
  VG-QUICK-PATH gate fixture only (verification/gates/quick_path.sh): requires a self-reported
  ToolCall and a self-reported ModelCall. The otel-genai-agent-session fixture gives a self-reported
  ToolCall but no ModelCall at all, so exactly one requirement is missing -- insufficient_evidence
  with one blind spot (event: ModelCall, class: self_report), proving the records-folder quick
  path's own checks_unlocked signal on a real scan.
applicability:
  applies_to_roles: [both]
evaluation:
  mode: automated
  rung: 2
  min_source_class: any
  minimum_evidence:
    - {event: ToolCall, class: self_report}
    - {event: ModelCall, class: self_report}
  shape: shapes/QP-UNLOCK.ttl
expectations:
  - {id: F1, text: "Fixture-only; not a real requirement."}
severity: high
tolerance: {kind: count, max: 0}
test_cases: []
