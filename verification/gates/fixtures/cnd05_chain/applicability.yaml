# Applicability profile for the VG-CND05-CHAIN gate fixture (verification/gates/cnd05_chain.sh): one subject, the
# baseline catalog and the Conduct overlay, whose CND-05 each case in cases.json is judged on.
profile_version: 1
observation_window:
  start: "2026-01-01T00:00:00Z"
  end: "2026-02-01T00:00:00Z"
content_capture:
  mode: hashes_only
catalogs:
  - "baseline@2026.09"
  - "conduct@2026.09"
subjects:
  - id: "spiffe://corp/agents/cnd05-fixture"
    # A system-of-record export counting the case's records reconciles coverage (SPEC §6.5; 18.134).
    coverage_denominators:
      - kind: system_of_record_export
        source: "urn:agentce:source:system-of-record-export:corp"
        manifest: "reference/coverage-counts-0.json"
    name: "CND-05 gate fixture subject"
    role: "both"
