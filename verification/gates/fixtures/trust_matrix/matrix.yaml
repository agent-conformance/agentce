dimensions:
  - name: instruction_class   # the acted-on Instruction's own agentcesourceclass (SPEC §6.2.1, §6.4)
    values: ["enforcement_point", "self_report", "independent_system"]
  - name: source_class   # Instruction.source_class (SPEC §6.2.3, Appendix F), or the member left out
    values: ["user", "operator", "service", "agent_identified", "memory_trusted", "agent_unidentified", "tool_output", "retrieved", "memory_untrusted", "missing"]
  - name: principal   # Instruction.principal (SPEC §6.2.3: MUST for user, operator, service, agent_identified)
    values: ["absent", "present"]
  - name: origin   # refs.origin of the chain's root instruction (SPEC §6.2.3, §6.3 agentce:derivedFrom)
    values: ["none", "ep_read_trusted", "ep_read_untrusted", "ep_read_no_trustmin", "sr_read", "tool_call", "resource_access", "not_held", "bare_id", "quarantined"]
  - name: chain_depth   # instructions in the refs.parent chain, the acted-on one included (1 is direct)
    values: ["1", "2", "3"]
  - name: parent_class   # class of the parent instructions
    values: ["same", "enforcement_point", "self_report"]
  - name: parent_source_class   # declared class of the chain's root parent
    values: ["same", "user", "tool_output", "missing"]
  - name: instruction_held   # how refs.instruction names the acted-on instruction (Appendix F danglingRef, quarantine)
    values: ["held", "not_held", "bare_id", "quarantined_schema", "quarantined_time_order", "other_subject"]
  - name: acted_on   # the event acting on the instruction (SPEC §6.3 agentce:actsOn)
    values: ["ToolCall", "consequential_ToolCall", "consequential_Decision", "Decision_only", "both", "minor_Decision", "ModelCall"]
  - name: call_class   # the acting ToolCall's own class
    values: ["enforcement_point", "self_report"]
  - name: unrelated_ep   # an enforcement-point event elsewhere in the subject, linked to nothing
    values: ["absent", "present"]
  - name: corroboration   # a PolicyDecision on the acting call (SPEC §7.7.3, §7.7.5, §10.4)
    values: ["none", "ep_pd_principal", "ep_pd_other_principal", "ep_pd_no_principal", "sr_pd_principal", "ep_pd_deny"]
  - name: relabel   # an ingress Instruction of the same content_ref and task (SPEC §7.7.5 reconciliation)
    values: ["none", "ep_twin_untrusted", "ep_twin_agrees"]
  - name: twin   # how the relabel twin differs from the acted-on instruction (SPEC §6.2.3 principal, §7.7.5)
    values: ["same", "other_content", "other_task", "other_subject", "other_authorised_class", "other_principal", "no_principal", "principal_empty_id", "principal_empty_object", "principal_string", "origin_ep_read_untrusted", "origin_sr_read", "parent_tool_output"]
  - name: pd_request   # refs.request of the corroborating PolicyDecision
    values: ["acting_call", "other_call"]
  - name: witness_time   # when the twin and the PolicyDecision are recorded against the acting call (SPEC §7.7.5)
    values: ["before", "same_instant", "same_instant_offset", "after_1s", "after", "missing", "unparseable"]
  - name: call_time   # the acting call's own time
    values: ["as_recorded", "missing", "unparseable", "forged_late"]
  - name: decision_time   # the Decision's own time
    values: ["as_recorded", "forged_late"]
  - name: parent_cycle   # a refs.parent cycle through the acted-on instruction (KD-283)
    values: ["none", "self", "pair"]
  - name: delegation   # a DelegationIssued named by the call (SPEC §6.3 agentce:chainVerified)
    values: ["none", "ep_verified", "ep_unverified", "sr_verified"]
  - name: refusal   # a Refusal of the acted-on instruction (CND-06; an enforcement-point Refusal is c06-refusal-en's focus)
    values: ["none", "sr_refusal"]
  - name: memory   # clean guard write and trust_min trusted read the decision used (ROB-02 minimum evidence)
    values: ["none", "clean"]
  - name: write   # the write of the record the decision used (ROB-02)
    values: ["ep_trusted", "none", "ep_untrusted", "ep_quarantined", "ep_block", "ep_sanitize", "sr_trusted", "sr_untrusted", "unmarked_untrusted_origin", "unmarked_trusted_origin", "unmarked_untrusted_nested"]
  - name: read   # the read of that record (ROB-02)
    values: ["ep_trusted", "none", "ep_untrusted", "ep_no_trustmin", "sr"]
  - name: path   # how the record reaches the consequential decision
    values: ["inputs", "consumer", "via_modelcall", "via_toolcall", "instruction_origin", "nothing"]
  - name: write_subject   # the write's subject against the deciding subject's
    values: ["same", "other"]
  - name: arrival_order   # in order, or a record quarantined for time_order (Appendix F)
    values: ["in_order", "late_time_order"]
  - name: decision_class   # the consequential decision's own class
    values: ["self_report", "enforcement_point"]
  - name: focus_class   # the focus event's own class (controls above self_report)
    values: ["enforcement_point", "independent_system", "self_report"]
  - name: shape_verdict   # whether the control's expectation holds on the focus, its class aside
    values: ["pass", "fail"]
  - name: login_class   # the identity-provider login record's class (SPEC §10.4)
    values: ["independent_system", "self_report"]
  - name: coverage   # an independent coverage denominator reconciling every event type, or none (SPEC §6.5)
    values: ["reconciled", "unknown"]
  - name: integrity   # the IntegrityResult of one stream (SPEC §6.6, §8.1)
    values: ["verified", "verified_signed", "weak_chained", "weak_unanchored", "unsigned", "gap", "failed", "missing", "time_suspect"]
  - name: integrity_stream   # which stream the integrity value applies to (a source role)
    values: ["ingress", "gateway", "guard", "policy", "agent", "sor", "focus"]

