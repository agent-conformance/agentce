# Trust-model case matrix, run by VG-TRUST-MATRIX (verification/gates/trust_matrix.py; format in its docstring).
# Every expected outcome comes from the SPEC section named in the cell's spec_ref, never from an engine. A cell the
# SPEC leaves open is ruling_needed with its two readings and a fail-closed default; a ruled cell's note names the
# ruling. Families (id prefix): c05 CND-05 instruction isolation; c04 CND-04 provenance; r02 ROB-02 memory; c06
# CND-06 refusals; fx the other controls whose min_source_class is above self_report; anchor cells write a gate case
# verbatim. Every generated bundle carries a verified integrity chain on every stream unless the cell's integrity
# dimension says otherwise (build.py). Words: not_conformant accepts non_conformant, insufficient_evidence or
# partial where the SPEC fixes no word. `quick:` is the set the quick tier runs; the full tier runs every cell.
# This file is generated: edit the generator, never the cells by hand (the gate pins its SHA-256).

