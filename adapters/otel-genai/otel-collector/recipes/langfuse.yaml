# A Collector recipe (item 16.3, trace-store ingestion) that fans the shared `otlp` receiver in
# ../config.yaml out to Langfuse's own OTel backend as well as to the local `file` exporter AgentCE's
# otel-genai adapter reads (see ../config.yaml's header comment for that half of the story). Langfuse
# runs a real OTLP endpoint at `https://cloud.langfuse.com/api/public/otel`, authenticated with HTTP
# Basic Auth (public key as username, secret key as password), and documents that it renders `gen_ai.*`
# semantic-convention spans as "generations" -- so its export is otel-genai-convention-shaped, the same
# convention family `adapters/otel-genai/fixtures/otel-genai-chat` already exercises, not OpenInference.
# Source: https://langfuse.com/docs/opentelemetry/get-started (retrieved 2026-09-24).
#
# Run it: `otelcol-contrib --config adapters/otel-genai/otel-collector/recipes/langfuse.yaml`, with
# `LANGFUSE_PUBLIC_KEY`/`LANGFUSE_SECRET_KEY` set in the environment. The `file` exporter's output is
# the same OTLP/JSON export shape as adapters/otel-genai/fixtures/langfuse/input.json, so a `collect`
# config source can name its path as its `export` exactly as adapters/fixtures/collect-dry-run.yaml
# does for the base recipe.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  otlphttp/langfuse:
    endpoint: https://cloud.langfuse.com/api/public/otel
    auth:
      authenticator: basicauth/langfuse
  file:
    path: /var/lib/agentce/exports/otel-genai/langfuse-traces.json
    format: json

extensions:
  basicauth/langfuse:
    client_auth:
      username: ${LANGFUSE_PUBLIC_KEY}
      password: ${LANGFUSE_SECRET_KEY}

service:
  extensions: [basicauth/langfuse]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/langfuse, file]
