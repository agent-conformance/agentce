[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agentce-adapter-policy-engines"
version = "0.0.1"
description = "AgentCE policy-engines adapter (SPEC 12): map OpenFGA, OPA, Cedar, and governance-toolkit decision logs to canonical AgentCE evidence events."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Agent Conformance Engine maintainers" }]
dependencies = [
  "pyyaml>=6,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agentce_adapters"]

# The engine is a test-only dependency: it validates adapter output against the generated evidence
# JSON Schema and re-checks byte-identity through the shared canonical form (SPEC 6.7). The adapter
# runtime and check_support_matrix depend on neither the engine nor any network access.
[tool.uv.sources]
agent-conformance = { path = "../../engines/python", editable = true }

[dependency-groups]
dev = [
  "agent-conformance",
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "mypy>=1.11,<2",
  "ruff>=0.6,<0.13",
  "types-pyyaml>=6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider --cov=agentce_adapters --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
branch = true
source = ["agentce_adapters"]

[tool.mypy]
python_version = "3.12"
